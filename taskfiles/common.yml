# Shareable tasks: nothing here knows about this repository. A caller passes
# what a task needs as variables and a task fails fast (`requires`) when one
# is missing. The repositories of High Five Labs are meant to include one
# copy of this file, so a fix is made once; this repository's Taskfile.yml
# is the example of how it is included.
#
#   includes:
#     common: ./taskfiles/common.yml
#
# Tasks in this file (an included task is called as common:<name>):
#   gofmt           fail if gofmt would change a Go file in DIRS
#   diff-clean      fail if PATHS differ from the index (generated files are stale)
#   setup-envtest   install setup-envtest (PACKAGE) into BIN, once
version: '3'

tasks:
  gofmt:
    desc: Fail if gofmt would change a Go file in DIRS
    requires:
      vars: [DIRS]
    cmds:
      - |
        out="$(gofmt -l {{.DIRS}})"
        if [ -n "${out}" ]; then
          echo "${out}"
          echo "gofmt needed"
          exit 1
        fi

  diff-clean:
    desc: Fail if PATHS differ from the index, as when generated files are stale
    requires:
      vars: [PATHS]
    cmds:
      - |
        git diff --exit-code -- {{.PATHS}} || {
          echo "{{.HINT | default "generated files are stale"}}"
          exit 1
        }

  setup-envtest:
    desc: Install setup-envtest (PACKAGE, with its version) into BIN
    requires:
      vars: [BIN, PACKAGE]
    status:
      - test -x {{.BIN}}/setup-envtest
    cmds:
      - GOBIN={{.BIN}} go install {{.PACKAGE}}
