    AccountKeyDatastoreCredentials:
      Secrets:
        $importSecretMode: never
    CertificateDatastoreCredentials:
      Secrets:
        $importSecretMode: never
    SasDatastoreCredentials:
      Secrets:
        $importSecretMode: never
    ServicePrincipalDatastoreCredentials:
      Secrets:
        $importSecretMode: never
    AccountKeyDatastoreSecrets:
      Key:
        $importSecretMode: required
    CertificateDatastoreSecrets:
      Certificate:
        $importSecretMode: required
    SasDatastoreSecrets:
      SasToken:
        $importSecretMode: required
    ServicePrincipalDatastoreSecrets:
      ClientSecret:
        $importSecretMode: required
    DatasetReference:
      Id:
        $referenceType: arm # a model version's dataset, "the fully qualified ARM id" (a data version: our WorkspacesDataVersion, or an ARM ID)
    # Asset IDs: the spec says "ARM resource ID", but Machine Learning also
    # takes asset URIs here (azureml://registries/{r}/environments/{e}/versions/{v},
    # a curated environment), which no ARM ID reference allows: plain strings.
    BatchDeploymentProperties:
      EnvironmentId:
        $referenceType: simple # an environment version's ARM ID or asset URI
    KubernetesOnlineDeployment:
      EnvironmentId:
        $referenceType: simple # as BatchDeploymentProperties
    ManagedOnlineDeployment:
      EnvironmentId:
        $referenceType: simple # as BatchDeploymentProperties
    CodeConfiguration:
      CodeId:
        $referenceType: simple # a code version's ARM ID or asset URI
    Collection:
      DataId:
        $referenceType: simple # a data asset's ARM ID or asset URI
    IdAssetReference:
      AssetId:
        $referenceType: simple # a model or other asset's ARM ID or asset URI
    OutputPathAssetReference:
      JobId:
        $referenceType: simple # a job's ID (jobs are not kinds here)
    DataPathAssetReference:
      DatastoreId:
        $referenceType: arm # a datastore (our WorkspacesDatastore, or an ARM ID)
    OnlineEndpointProperties:
      Compute:
        $referenceType: arm # an attached Kubernetes compute (ASO's WorkspacesCompute, or an ARM ID)
      Keys:
        $importSecretMode: never # as BatchEndpointProperties
    BatchEndpointProperties:
      Keys:
        $importSecretMode: never # an object of two keys, each a Secret (EndpointAuthKeys)
    EndpointAuthKeys:
      PrimaryKey:
        $importSecretMode: required
      SecondaryKey:
        $importSecretMode: required
