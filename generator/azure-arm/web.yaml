    # App Service Environment v3 (docs/plan.md f41, 2026-11-23): the
    # environment, its networking and custom DNS suffix configurations
    # (fixed names) and its private endpoint connections. Not its multi-role
    # and worker pools, which only the retired v1 and v2 environments use.
    HostingEnvironment:
      $exportAs: HostingEnvironment
      $supportedFrom: v0.1.0
    # docs/plan.md f53: certificates of an app and of a slot (the PFX and
    # its password from Secrets, as Certificate's), a slot's source control
    # (sourcecontrols/web, as ASO's SitesSourcecontrol for an app), the
    # gateway of an app's or slot's gateway-required virtual network
    # integration (no DELETE: detach-on-delete), a static web app's basic
    # authentication (basicAuth/default, no DELETE), App Service AI gateways
    # and Kubernetes environments (App Service on Azure Arc). Not a plan's
    # virtual network gateways and routes: serverfarms/{name}/
    # virtualNetworkConnections/{vnet} is no resource.
    Sites_Certificate:
      $exportAs: SitesCertificate
      $supportedFrom: v0.1.0
    Sites_Slots_Certificate:
      $exportAs: SitesSlotsCertificate
      $supportedFrom: v0.1.0
    Sites_Slots_Sourcecontrol:
      $exportAs: SitesSlotsSourcecontrol
      $supportedFrom: v0.1.0
    Sites_VirtualNetworkConnections_Gateway:
      $exportAs: SitesVirtualNetworkConnectionsGateway
      $supportedFrom: v0.1.0
    Sites_Slots_VirtualNetworkConnections_Gateway:
      $exportAs: SitesSlotsVirtualNetworkConnectionsGateway
      $supportedFrom: v0.1.0
    StaticSites_BasicAuth:
      $exportAs: StaticSitesBasicAuth
      $supportedFrom: v0.1.0
    AiGateway:
      $exportAs: AiGateway
      $supportedFrom: v0.1.0
    KubeEnvironment:
      $exportAs: KubeEnvironment
      $supportedFrom: v0.1.0
    HostingEnvironments_Configurations_Networking:
      $exportAs: HostingEnvironmentsConfigurationNetworking
      $supportedFrom: v0.1.0
    HostingEnvironments_Configurations_Customdnssuffix:
      $exportAs: HostingEnvironmentsConfigurationCustomDnsSuffix
      $supportedFrom: v0.1.0
    HostingEnvironments_PrivateEndpointConnection:
      $exportAs: HostingEnvironmentsPrivateEndpointConnection
      $supportedFrom: v0.1.0
    SiteContainerProperties:
      PasswordSecret:
        $importSecretMode: required # the registry password of a sidecar's image: from a Secret
    RelayServiceConnectionEntityProperties:
      EntityConnectionString:
        $importSecretMode: required # a Relay connection string with its SAS key: from a Secret
      ResourceConnectionString:
        $importSecretMode: required # the same, for the Relay resource: from a Secret
    # Reference and resource labels, as ASO's web.yaml has them for 2026-07-15
    ApiManagementConfig:
      Id:
        $referenceType: arm
    CloningInfo:
      TrafficManagerProfileId:
        $referenceType: arm
      SourceWebAppId:
        $referenceType: arm
    FunctionsDeploymentStorageAuthentication:
      UserAssignedIdentityResourceId:
        $referenceType: arm
    HostingEnvironmentProfile:
      Id:
        $referenceType: arm
    IpSecurityRestriction:
      VnetSubnetResourceId:
        $referenceType: arm
    SiteProperties:
      ServerFarmId:
        $referenceType: arm
      VirtualNetworkSubnetId:
        $referenceType: arm
      ManagedEnvironmentId:
        $referenceType: arm
    CertificateProperties:
      Password:
        $importSecretMode: required # the password of the PFX in pfxBlob
      PfxBlob:
        $importSecretMode: required # the PFX holds the private key: a Secret, not the spec
    CertificateProperties_STATUS:
      Password:
        $importSecretMode: never # a status never holds the password
    OpenIdConnectConfig:
      TokenEndpoint:
        $importSecretMode: never # an OpenID Connect provider's token URL, not a secret (autolabel, reviewed)
    # A log destination's SAS URL carries its signature: a Secret, never the
    # spec; Azure returns it, so it is removed from the status too.
    AzureBlobStorageApplicationLogsConfig:
      SasUrl:
        $importSecretMode: required
    AzureBlobStorageHttpLogsConfig:
      SasUrl:
        $importSecretMode: required
    AzureTableStorageApplicationLogsConfig:
      SasUrl:
        $importSecretMode: required
    DatabaseConnectionProperties:
      ConnectionString:
        $importSecretMode: required # a database connection string carries its credential: from a Secret
      ResourceId:
        $referenceType: arm # the database (a Cosmos DB account, SQL server or the like) (autolabel, reviewed)
      ConnectionIdentity:
        $referenceType: simple # SystemAssigned or a user-assigned identity's ID, as Azure takes it (autolabel, reviewed)
    StaticSiteUserProvidedFunctionAppARMResourceProperties:
      FunctionAppResourceId:
        $referenceType: arm # the function app: ASO's Site or an ARM ID (autolabel, reviewed)
    VnetInfo:
      VnetResourceId:
        $referenceType: arm # the virtual network or subnet (autolabel, reviewed)
    IdentifierProperties:
      Id:
        $referenceType: simple # the identifier's value (a domain verification ID), not an ARM ID (autolabel wrote arm; reviewed)
    StaticSiteLinkedBackendARMResourceProperties:
      BackendResourceId:
        $referenceType: arm # the backend (a function app, container app or API Management service) (autolabel, reviewed)
    StaticSiteCustomDomainOverviewARMResourceProperties:
      ValidationToken:
        $importSecretMode: never # the token Azure makes for a custom domain's TXT record, published in DNS: not a secret, and the status must show it (autolabel wrote required; reviewed)
    PrivateAccessVirtualNetwork:
      ResourceId:
        $referenceType: arm # the virtual network's ARM ID (autolabel, reviewed)
    VirtualNetworkProfile:
      Id:
        $referenceType: arm # the virtual network, or the subnet, the environment is injected into (autolabel, reviewed)
    KubeEnvironmentProperties:
      AksResourceID:
        $referenceType: arm # the AKS cluster of an App Service on Azure Arc environment
    ContainerAppsConfiguration:
      ControlPlaneSubnetResourceId:
        $referenceType: arm # a subnet (autolabel, reviewed)
      AppSubnetResourceId:
        $referenceType: arm # a subnet (autolabel, reviewed)
    StaticSiteBasicAuthPropertiesARMResourceProperties:
      Password:
        $importSecretMode: required # the static web app's basic authentication password: from a Secret
  # Logic Apps API connections, custom APIs (custom connectors) and on-premises
  # data gateways (logicAppsManagementClient.json, 2016-06-01, their only
  # version; docs/plan.md f56). In a resource group.
  2016-06-01:
    Connection:
      $exportAs: ApiConnection
      $supportedFrom: v0.1.0
    CustomApi:
      $exportAs: CustomApi
      $supportedFrom: v0.1.0
    ConnectionGateway:
      $exportAs: ConnectionGateway
      $supportedFrom: v0.1.0
    Connection_Properties_Spec:
      ParameterValues:
        $importSecretMode: required # the connection's credentials (a connection string, a key, a password): each value from a Secret
      CustomParameterValues:
        $importSecretMode: required # a custom connector's parameter values, as secret as the others
    ApiOAuthSettings:
      ClientSecret:
        $importSecretMode: required # a custom API's OAuth client secret: from a Secret
    ApiReference:
      Id:
        $referenceType: arm # the API a connection uses: a managed API (/subscriptions/{s}/providers/Microsoft.Web/locations/{l}/managedApis/{api}) by ARM ID, or our CustomApi
    ConnectionGatewayReference:
      Id:
        $referenceType: arm # the gateway installation (/subscriptions/{s}/providers/Microsoft.Web/locations/{l}/connectionGatewayInstallations/{id}), registered by installing the gateway on a machine
