typeTransformers:
  - group: web
    version: v20260715
    name: AzureBlobStorageApplicationLogsConfig_STATUS;AzureBlobStorageHttpLogsConfig_STATUS;AzureTableStorageApplicationLogsConfig_STATUS
    property: SasUrl
    remove: true
    because: a SAS URL carries its signature; the status never holds it
  - group: web
    version: v20260715
    name: DatabaseConnectionProperties_STATUS
    property: ConnectionString
    remove: true
    because: a connection string carries its credential; the status never holds it
  - group: web
    version: v20260715
    name: RelayServiceConnectionEntityProperties_STATUS
    property: EntityConnectionString;ResourceConnectionString
    remove: true
    because: Relay connection strings carry their SAS keys; the status never holds them
  - group: web
    version: v20160601
    name: Connection_Properties_STATUS
    property: ParameterValues;CustomParameterValues
    remove: true
    because: an API connection's parameter values carry its credentials (connection strings, keys, passwords); the status never holds them
  - group: web
    version: v20160601
    name: ApiOAuthSettings_STATUS
    property: ClientSecret
    remove: true
    because: a custom API's OAuth client secret; the status never holds it
  - group: web
    version: v20260715
    name: SiteContainerProperties_STATUS
    property: PasswordSecret
    remove: true
    because: a sidecar's registry password; the status never holds it
typeFilters:
  - action: include
    group: web
    version: v20260715
    because: the version of ASO's Site and ServerFarm, the owners of what we generate
  - action: include
    group: web
    version: v20160601
    because: the only version of the Logic Apps API connections, custom APIs and on-premises data gateways (logicAppsManagementClient.json; docs/plan.md f56)
  - action: prune
    group: web
    because: every other version is left alone
