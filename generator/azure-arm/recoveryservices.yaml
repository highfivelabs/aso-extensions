typeFilters:
  - action: include
    group: recoveryservices
    version: v20260701
    because: the newest stable version that both the vault and the backup specs have

groupModelConfiguration:
  2026-07-01:
    Vault:
      $exportAs: Vault
      $supportedFrom: v0.1.0
    Vaults_BackupPolicy:
      $exportAs: VaultsBackupPolicy
      $supportedFrom: v0.1.0
    Vaults_BackupResourceGuardProxy:
      $exportAs: VaultsBackupResourceGuardProxy
      $supportedFrom: v0.1.0
    Vaults_PrivateEndpointConnection:
      $exportAs: VaultsPrivateEndpointConnection
      $supportedFrom: v0.1.0
    # A vault's settings singletons (docs/plan.md f50), fixed-name children
    # (generator/fixed-names.txt, patch 0014) with no DELETE. Not the vault's
    # extended information (the legacy agent registration's integrity and
    # encryption keys, which the spec does not mark secret).
    Vaults_Backupconfig_Vaultconfig:
      $exportAs: VaultsBackupConfig
      $supportedFrom: v0.1.0
    Vaults_Backupstorageconfig_Vaultstorageconfig:
      $exportAs: VaultsBackupStorageConfig
      $supportedFrom: v0.1.0
    Vaults_BackupEncryptionConfigs_BackupResourceEncryptionConfig:
      $exportAs: VaultsBackupEncryptionConfig
      $supportedFrom: v0.1.0
    CmkKekIdentity:
      UserAssignedIdentity:
        $referenceType: arm # the identity that reads the customer-managed key
    AssociatedIdentity:
      UserAssignedIdentity:
        $referenceType: arm
    # --- reference labels (added by iteration) ---
    BmsPrivateEndpoint:
      Id:
        $referenceType: arm
    ResourceGuardProxyBase:
      ResourceGuardResourceId:
        $referenceType: arm
    UserAssignedManagedIdentityDetails:
      IdentityArmId:
        $referenceType: arm
