typeFilters:
  - action: include
    group: recoveryservices
    version: v20260701
    because: the newest stable version that the vault, the backup and the Site Recovery specs have
groupModelConfiguration:
  2026-07-01:
    Vault:
      $exportAs: Vault
      $supportedFrom: v0.1.0
    Vaults_BackupPolicy:
      $exportAs: VaultsBackupPolicy
      $supportedFrom: v0.1.0
    Vaults_BackupResourceGuardProxy:
      $exportAs: VaultsBackupResourceGuardProxy
      $supportedFrom: v0.1.0
    Vaults_PrivateEndpointConnection:
      $exportAs: VaultsPrivateEndpointConnection
      $supportedFrom: v0.1.0
    # A vault's settings singletons (docs/plan.md f50), fixed-name children
    # (generator/fixed-names.txt, patch 0014) with no DELETE. Not the vault's
    # extended information (the legacy agent registration's integrity and
    # encryption keys, which the spec does not mark secret).
    Vaults_Backupconfig_Vaultconfig:
      $exportAs: VaultsBackupConfig
      $supportedFrom: v0.1.0
    Vaults_Backupstorageconfig_Vaultstorageconfig:
      $exportAs: VaultsBackupStorageConfig
      $supportedFrom: v0.1.0
    Vaults_BackupEncryptionConfigs_BackupResourceEncryptionConfig:
      $exportAs: VaultsBackupEncryptionConfig
      $supportedFrom: v0.1.0
    # Azure Site Recovery (docs/plan.md f52; specification/recoveryservicessiterecovery,
    # 2026-07-01): fabrics, protection containers and their mappings,
    # replication policies, replicated and migrated items, protection
    # clusters, recovery plans, registered providers and vCenters, and the
    # vault's replication alert and vault settings. Named Vaults<Type>,
    # without the intermediate ReplicationFabrics/ReplicationProtectionContainers
    # segments (a CRD's plural is one DNS label of at most 63 characters).
    # Not exported: network and storage classification mappings
    # (replicationNetworks and replicationStorageClassifications are no
    # resources, so the generator cannot own them). No DELETE in the spec
    # (detach-on-delete): protection containers (removed with a POST), alert
    # settings, vault settings and protection intents.
    Vaults_ReplicationFabric:
      $exportAs: VaultsReplicationFabric
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationProtectionContainer:
      $exportAs: VaultsReplicationProtectionContainer
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationProtectionContainers_ReplicationProtectionContainerMapping:
      $exportAs: VaultsReplicationProtectionContainerMapping
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationProtectionContainers_ReplicationProtectedItem:
      $exportAs: VaultsReplicationProtectedItem
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationProtectionContainers_ReplicationMigrationItem:
      $exportAs: VaultsReplicationMigrationItem
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationProtectionContainers_ReplicationProtectionCluster:
      $exportAs: VaultsReplicationProtectionCluster
      $supportedFrom: v0.1.0
    Vaults_ReplicationFabrics_ReplicationRecoveryServicesProvider:
