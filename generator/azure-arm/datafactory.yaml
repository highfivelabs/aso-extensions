# Data Factory kinds ASO does not export (Microsoft.DataFactory, 2018-06-01,
# the only stable version and the one of ASO's own Factory; docs/plan.md f78,
# tier 3 row t10 of docs/coverage/foundation.md): a factory's managed
# virtual network and its managed private endpoints, credentials (a
# user-assigned identity or a service principal), global parameters and
# private endpoint connections; and (f86) triggers, data flows, integration
# runtimes and change data capture. Owned by ASO's Factory.
#
# Not exported: linked services, datasets and pipelines. With patches 0018,
# 0019 and 0008's digit rule (f84, f86) they generate, but each is one union
# of every type, and their CRDs are far over what an install can apply
# (datasets 854 KB and pipelines 3.36 MB of JSON; linked services 2.67 MB of
# YAML): splitting them into one kind per type is open question 17 in
# docs/plan.md section 8.
typeFilters:
  - action: include
    group: datafactory
    version: v20180601
    because: the only stable version, ASO's own (v20180601)
  - action: prune
    group: datafactory
    because: every other version is left alone (ASO has the factory)
typeTransformers:
  - group: datafactory
    name: ExpressionV2;ExpressionV2_STATUS
    property: Operands
    remove: true
    because: We don't currently support directly recursive types (ASO's datafactory.yaml).
  - group: datafactory
    version: v20180601
    name: SecureString_STATUS
    property: Value
    remove: true
    because: >-
      an integration runtime's secure strings (the SSIS catalog's admin
      password, a custom setup script's SAS token, a package store's or
      express custom setup's credentials) come from Secrets (below); a
      status must not hold them
groupModelConfiguration:
  2018-06-01:
    Factories_ManagedVirtualNetwork:
      $exportAs: FactoriesManagedVirtualNetwork
      $supportedFrom: v0.1.0
    Factories_ManagedVirtualNetworks_ManagedPrivateEndpoint:
      $exportAs: FactoriesManagedVirtualNetworksManagedPrivateEndpoint
      $supportedFrom: v0.1.0
    Factories_Credential:
      $exportAs: FactoriesCredential
      $supportedFrom: v0.1.0
    Factories_GlobalParameter:
      $exportAs: FactoriesGlobalParameter
      $supportedFrom: v0.1.0
    Factories_PrivateEndpointConnection:
      $exportAs: FactoriesPrivateEndpointConnection
      $supportedFrom: v0.1.0
    ManagedIdentityTypeProperties:
      ResourceId:
        $referenceType: arm # the user-assigned identity a credential stands for
    ManagedPrivateEndpoint:
      PrivateLinkResourceId:
        $referenceType: arm # what the managed private endpoint connects to
    PrivateEndpoint:
      Id:
        $referenceType: arm # the private endpoint of a connection
    Factories_Trigger:
      $exportAs: FactoriesTrigger
      $supportedFrom: v0.1.0
    Factories_Dataflow:
      $exportAs: FactoriesDataflow
      $supportedFrom: v0.1.0
    Factories_IntegrationRuntime:
      $exportAs: FactoriesIntegrationRuntime
      $supportedFrom: v0.1.0
    Factories_Adfcdc:
      $exportAs: FactoriesAdfcdc
      $supportedFrom: v0.1.0
    BlobEventsTriggerTypeProperties:
      Scope:
        $referenceType: arm # the storage account whose events fire the trigger
    CustomEventsTriggerTypeProperties:
      Scope:
        $referenceType: arm # the Event Grid topic whose events fire the trigger
    IntegrationRuntimeVNetProperties:
      PublicIPs:
        $referenceType: arm # the public IP addresses an SSIS runtime uses
    LinkedIntegrationRuntimeRbacAuthorization:
      ResourceId:
        $referenceType: arm # the shared self-hosted runtime a linked runtime uses
    SecureString:
      Value:
        $importSecretMode: required # an integration runtime's secure strings, Secrets (as synapse.yaml, from ASO's sql.yaml)
