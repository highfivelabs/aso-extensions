typeTransformers:
  # As ASO's app.yaml: 2026-01-01 (and 2026-03-02-preview, with its Builder) imports ManagedServiceIdentity from two
  # versions of common-types; take v6's.
  - name: ContainerApp_Spec;ManagedEnvironment_Spec;Job_Spec;SessionPool_Spec;ConnectedEnvironment_Spec;Builder_Spec
    property: Identity
    target:
      name: ManagedServiceIdentity
      version: v6
      optional: true
    because: Multiple incompatible versions of ManagedServiceIdentity are being imported from different versions of common
  - name: ContainerApp_STATUS;ManagedEnvironment_STATUS;Job_STATUS;SessionPool_STATUS;ConnectedEnvironment_STATUS;Builder_STATUS
    property: Identity
    target:
      name: ManagedServiceIdentity_STATUS
      version: v6
      optional: true
    because: Multiple incompatible versions of ManagedServiceIdentity_STATUS are being imported from different versions of common
typeFilters:
  - action: include
    group: app
    version: v20250101
    because: the version of the owner, ASO's ManagedEnvironment, and the newest stable one with the children we generate
  - action: include
    group: app
    version: v20260101
    because: >-
      the newest stable version, for the kinds 2025-01-01 lacks (connected environments and their children, an environment's HTTP route configs, maintenance configurations and private endpoint connections, a container app's source controls, session pools); ASO's owners stay at 2025-01-01, the versions need not match
  - action: include
    group: app
    version: v20251002preview
    because: >-
      the one version with all of the environment's fields the catalog's avm-res-app-managedenvironment sends (appInsightsConfiguration, openTelemetryConfiguration, ingressConfiguration and publicNetworkAccess, as 2026-07-01 has them, and availabilityZones and diskEncryptionConfiguration, which no stable version and not 2026-03-02-preview have), for our ManagedEnvironment (2026-11-13)
  - action: include
    group: app
    version: v20260302preview
    because: >-
      the newest preview, for what no stable version has: Dapr subscriptions, and Java components of the Nacos and Spring Cloud Gateway types (the catalog's avm-res-app-managedenvironment, 2026-11-13)
  - action: include
    group: app
    version: v20260701
    because: the newest stable version, the first stable one with .NET components
  - action: prune
    group: app
    because: every other version is left alone
groupModelConfiguration:
  2025-01-01:
    ManagedEnvironments_DaprComponent:
      $exportAs: ManagedEnvironmentsDaprComponent
      $supportedFrom: v0.1.0
    ManagedEnvironments_Certificate:
      $exportAs: ManagedEnvironmentsCertificate
      $supportedFrom: v0.1.0
    ManagedEnvironments_ManagedCertificate:
      $exportAs: ManagedEnvironmentsManagedCertificate
      $supportedFrom: v0.1.0
    Secret:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    CertificateKeyVaultProperties:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    ManagedEnvironments_ManagedCertificate_Properties_STATUS:
      ValidationToken:
        $importSecretMode: never # a DNS TXT record's value, not a secret
  2026-01-01:
    # Moved from 2025-01-01 (2026-11-13): an Azure Files share's account key
    # from Key Vault (azureFile.accountKeyVaultProperties).
    ManagedEnvironments_Storage:
      $exportAs: ManagedEnvironmentsStorage
      $supportedFrom: v0.1.0
    ConnectedEnvironment:
      $exportAs: ConnectedEnvironment
      $supportedFrom: v0.1.0
    ConnectedEnvironments_Certificate:
      $exportAs: ConnectedEnvironmentsCertificate
      $supportedFrom: v0.1.0
    ConnectedEnvironments_DaprComponent:
      $exportAs: ConnectedEnvironmentsDaprComponent
      $supportedFrom: v0.1.0
    ConnectedEnvironments_Storage:
      $exportAs: ConnectedEnvironmentsStorage
      $supportedFrom: v0.1.0
    ContainerApps_SourceControl:
      $exportAs: ContainerAppsSourceControl
      $supportedFrom: v0.1.0
    ManagedEnvironments_HttpRouteConfig:
      $exportAs: ManagedEnvironmentsHttpRouteConfig
      $supportedFrom: v0.1.0
    ManagedEnvironments_MaintenanceConfiguration:
      $exportAs: ManagedEnvironmentsMaintenanceConfiguration
      $supportedFrom: v0.1.0
    ManagedEnvironments_PrivateEndpointConnection:
      $exportAs: ManagedEnvironmentsPrivateEndpointConnection
      $supportedFrom: v0.1.0
    SessionPool:
      $exportAs: SessionPool
      $supportedFrom: v0.1.0
    CertificateKeyVaultProperties:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity (autolabel wrote simple)
    ManagedIdentitySetting:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity (autolabel wrote simple)
    CustomDomain:
      CertificateId:
        $referenceType: arm # a certificate's ARM ID (autolabel wrote simple)
    SecretKeyVaultProperties:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity (autolabel wrote simple)
    SessionRegistryCredentials:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity (autolabel wrote simple)
      PasswordSecretRef:
        $importSecretMode: never # the name of a secret of the pool, not a secret (autolabel, reviewed)
    Secret:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity (autolabel wrote simple)
  2026-03-02-preview:
    # Moved from 2025-01-01 (2026-11-13): the Nacos and Spring Cloud Gateway
    # component types, and ingress on the types that have it.
    ManagedEnvironments_JavaComponent:
      $exportAs: ManagedEnvironmentsJavaComponent
      $supportedFrom: v0.1.0
    ManagedEnvironments_DaprSubscription:
      $exportAs: ManagedEnvironmentsDaprSubscription
      $supportedFrom: v0.1.0
    ScgRoute:
      Id:
        $referenceType: simple # a Spring Cloud Gateway route's own identifier, not an ARM ID (autolabel wrote arm)
  2025-10-02-preview:
    # Our ManagedEnvironment beside ASO's (2025-01-01), for the fields
    # ASO's lacks (2026-11-13). Labels as ASO's app.yaml has them for
    # 2025-01-01.
    ManagedEnvironment:
      $exportAs: ManagedEnvironment
      $supportedFrom: v0.1.0
    VnetConfiguration:
      InfrastructureSubnetId:
        $referenceType: arm
    CertificateKeyVaultProperties:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
  2026-07-01:
    # Our ContainerApp beside ASO's (2025-01-01), for `kind` (2026-11-13).
    # Labels as ASO's app.yaml has them for 2025-01-01.
    ContainerApp:
      $exportAs: ContainerApp
      $supportedFrom: v0.1.0
      # No $generatedConfigs (ASO's exports the FQDN and event stream endpoint
      # to a ConfigMap): its generated code imports ASO's internal
      # genericarmclient, which this module may not import.
    RegistryCredentials:
      passwordSecretRef:
        $importSecretMode: never
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    ServiceBind:
      ServiceId:
        $referenceType: arm
    Secret:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    ContainerApp_Spec:
      ManagedBy:
        $referenceType: arm
    ContainerAppProperties: # ContainerApp_Properties_Spec in ASO's 2025-01-01 (the TypeSpec file names it)
      EnvironmentId:
        $referenceType: arm # the environment's ARM ID (autolabel wrote simple)
      ManagedEnvironmentId:
        $referenceType: arm # the environment's ARM ID (autolabel wrote simple)
    ContainerAppNetworkingConfiguration:
      OutboundVnetSubnetId:
        $referenceType: arm # a subnet's ARM ID (autolabel wrote simple)
    CustomDomain:
      CertificateId:
        $referenceType: arm
    IdentitySettings:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    HttpScaleRule:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    TcpScaleRule:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    CustomScaleRule:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    QueueScaleRule:
      Identity:
        $referenceType: arm+wellknown # permits `system` to use a system-assigned identity
    ManagedEnvironments_DotNetComponent:
      $exportAs: ManagedEnvironmentsDotNetComponent
      $supportedFrom: v0.1.0
