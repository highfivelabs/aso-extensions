# API Management kinds ASO does not export (Microsoft.ApiManagement, the
# 2024-05-01 specs, the newest stable version and the one of ASO's own
# Service, Api and Product; docs/plan.md f64, the first part of tier 3 row t4
# of docs/coverage/foundation.md): an API's operations (with their policies
# and tags), schemas, tag descriptions and tags; a product's tags; the
# service's tags, global schemas, identity providers (the developer portal's
# sign-in), OpenID Connect providers and OAuth 2.0 authorization servers
# (for the APIs' OAuth settings), and external caches. Owned by ASO's
# Service, Api and Product and our ApiOperation.
#
# The second part (docs/plan.md f71): a GraphQL API's resolvers and their
# policies; the links made from a tag's side (apiLinks, operationLinks,
# productLinks) and from a product's (apiLinks, groupLinks; the same links
# as ASO's ProductApi and ProductGroup, by ARM ID); API releases, wikis and
# documentations, policy restrictions and private endpoint connections;
# and the v2 gateways (Microsoft.ApiManagement/gateways, in a resource
# group: a workspace gateway) with their configuration connections to a
# workspace.
#
# The third part (docs/plan.md f72): workspaces (a Premium service's) and
# their children, the same contracts as the service's own: APIs with their
# operations, policies, releases, schemas and diagnostics, version sets,
# backends, certificates, diagnostics, groups and their users, loggers,
# named values, policies and fragments, products with their links and
# policies, schemas, subscriptions, and tags with their links.
#
# Not exported here: a workspace's notifications and their recipients (no
# attributes; their names are an enum of notification kinds), the
# developer portal's content, API issues and the tenant's access keys.
typeFilters:
  - action: include
    group: apimanagement
    version: v20240501
    because: the newest stable version, the one of ASO's Service, Api and Product (v20240501)
  - action: prune
    group: apimanagement
    because: every other version is left alone (ASO has the service and most of its children)
typeTransformers:
  - name: Service_IdentityProvider_Name_Spec
    group: apimanagement
    version: v20240501
    target:
      name: string
    because: >-
      An identity provider's name is its type (aad, aadB2C, facebook, google,
      microsoft, twitter). ASO's generator keeps such an enum in the storage
      version, which then imports the API version that imports it, an import
      cycle (as operationalinsights.yaml says of linked storage accounts). A
      string it is; the fake, as Azure, refuses any other name.
  - group: apimanagement
    version: v20240501
    name: AuthorizationServerContractProperties_STATUS
    property: ResourceOwnerPassword
    remove: true
    because: a password; Azure does not return it, and it is not shown in the status
  - group: apimanagement
    version: v20240501
    name: Service_PrivateEndpointConnection_Spec
    property: Id
    remove: true
    because: >-
      The connection's own ARM ID, which the request may repeat; the kind's
      owner and name already make it.
