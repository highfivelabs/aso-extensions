# PostgreSQL flexible server children ASO does not export
# (Microsoft.DBforPostgreSQL, 2025-08-01, the version of ASO's own v20250801
# FlexibleServer): a server's private endpoint connections (docs/plan.md
# f38). Owned by ASO's FlexibleServer. The group is the one our hand-written
# PostgreSQL User has (apis/dbforpostgresql/v1); the generated kinds are
# other versions of it.
typeFilters:
  - action: include
    group: dbforpostgresql
    version: v20250801
    because: the version of ASO's FlexibleServer (v20250801)
  - action: prune
    group: dbforpostgresql
    because: every other version is left alone
groupModelConfiguration:
  2025-08-01:
    FlexibleServers_PrivateEndpointConnection:
      $exportAs: FlexibleServersPrivateEndpointConnection
      $supportedFrom: v0.1.0
