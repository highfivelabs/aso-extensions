# Azure Cosmos DB children ASO does not export (Microsoft.DocumentDB,
# 2024-08-15, the version of ASO's DatabaseAccount, so owner and child share
# a vintage): Gremlin databases and graphs, Cassandra keyspaces and tables,
# Table API tables, their throughput settings, dedicated gateways and other
# services, SQL role definitions, private endpoint connections and client
# encryption keys. The catalog's modules use Gremlin and the SQL dedicated
# gateway (docs/coverage/catalog-azure.md). Owned by ASO's DatabaseAccount
# (or SqlDatabase, a client encryption key), then by our kinds. At
# 2026-03-15 also role-based access for the other APIs and Cosmos DB fleets
# (docs/plan.md f47); at 2026-06-01 (specification/mongocluster) a MongoDB
# vCore cluster's Entra users, owned by ASO's MongoCluster.
typeFilters:
  - action: include
    group: documentdb
    version: v20240815
    because: the version of ASO's DatabaseAccount (v1api20240815, its storage version)
  - action: include
    group: documentdb
    version: v20260315
    because: role-based access for the Cassandra, Gremlin, MongoDB (Entra) and Table APIs, and fleets, the newest stable version (2024-08-15 has none)
  - action: include
    group: documentdb
    version: v20240701
    because: a MongoDB vCore cluster's private endpoint connections (docs/plan.md f38; specification/mongocluster), the version of ASO's MongoCluster (v1api20240701)
  - action: include
    group: documentdb
    version: v20260601
    because: a MongoDB vCore cluster's Microsoft Entra users (docs/plan.md f47; specification/mongocluster, the newest stable version; 2024-07-01, ASO's, has none)
  - action: prune
    group: documentdb
    because: every other version is left alone
groupModelConfiguration:
  2024-07-01:
    MongoClusters_PrivateEndpointConnection:
      $exportAs: MongoClustersPrivateEndpointConnection
      $supportedFrom: v0.1.0
  2024-08-15:
    DatabaseAccounts_GremlinDatabase:
