typeFilters:
  - action: include
    group: authorization
    version: v20260701
    because: the newest stable version of Azure Policy (definitions, set definitions, assignments)
  - action: include
    group: authorization
    version: v20260101preview
    because: policy exemptions exist only in preview versions; this is the newest
  - action: include
    group: authorization
    version: v20200501
    because: Resource Manager private links and their management group associations (the only version)
  - action: include
    group: authorization
    version: v20241201preview
    because: policy variables and their values (preview only)
  - action: include
    group: authorization
    version: v20201001
    because: Privileged Identity Management (role eligibility and assignment schedule requests, role management policy assignments); the version ASO PR #5638 generates its RoleEligibilityScheduleRequest from
  - action: prune
    group: authorization
    because: every other version is left alone (locks are the hand-written ManagementLock)
groupModelConfiguration:
  # Privileged Identity Management. RoleEligibilityScheduleRequest is copied
  # from ASO PR #5638 (head 5d0e686e) as it is, but for $supportedFrom (our
  # release); RoleAssignmentScheduleRequest is configured the same way.
  # A request's name must be a GUID: the hand-written Claimer in
  # generator/_extensions/authorization/customizations defaults it, where ASO
  # has a webhook (docs/plan.md, "Names that must be GUIDs").
  2020-10-01:
    RoleEligibilityScheduleRequest:
      $exportAs: RoleEligibilityScheduleRequest
      $supportedFrom: v0.1.0
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any request without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleEligibilityScheduleRequestProperties:
      PrincipalId:
        $importConfigMapMode: optional
      RoleDefinitionId:
        $description: The role definition ID. This can be the ARM ID of a custom role definition, or the well-known name of a built-in role definition. See https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles for well-known role definition names.
        $referenceType: arm+wellknown
        # Note that while there are fields TargetRoleEligibilityScheduleId and TargetRoleEligibilityScheduleInstanceId which
        # are definitely at least sometimes ARM IDs (see the test recordings for this resource), but according to this sample:
        # https://github.com/Azure/azure-rest-api-specs/blob/main/specification/authorization/resource-manager/Microsoft.Authorization/Authorization/stable/2020-10-01/examples/PutRoleEligibilityScheduleRequest.json
        # they are also sometimes UUIDs. Not forcing them to ARM ID at this point due to the above.
    RoleAssignmentScheduleRequest:
      $exportAs: RoleAssignmentScheduleRequest
      $supportedFrom: v0.1.0
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any request without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleAssignmentScheduleRequestProperties:
      PrincipalId:
        $importConfigMapMode: optional
      RoleDefinitionId:
        $description: The role definition ID. This can be the ARM ID of a custom role definition, or the well-known name of a built-in role definition. See https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles for well-known role definition names.
        $referenceType: arm+wellknown
        # As for the eligibility request: TargetRoleAssignmentScheduleId,
        # TargetRoleAssignmentScheduleInstanceId and
        # LinkedRoleEligibilityScheduleId are left as strings.
    RoleManagementPolicyAssignment:
      $exportAs: RoleManagementPolicyAssignment
      $supportedFrom: v0.1.0
    RoleManagementPolicyAssignmentProperties:
      PolicyId:
        $referenceType: arm # a Microsoft.Authorization/roleManagementPolicies resource (Azure makes them; by ARM ID)
      RoleDefinitionId:
        $referenceType: arm # a role definition, by ARM ID
  2026-07-01:
    PolicyDefinition:
      $exportAs: PolicyDefinition
      $supportedFrom: v0.1.0
    PolicyDefinitions_Version:
      $exportAs: PolicyDefinitionsVersion
      $supportedFrom: v0.1.0
    PolicySetDefinitions_Version:
      $exportAs: PolicySetDefinitionsVersion
      $supportedFrom: v0.1.0
    PolicySetDefinition:
      $exportAs: PolicySetDefinition
      $supportedFrom: v0.1.0
    PolicyAssignment:
      $exportAs: PolicyAssignment
      $supportedFrom: v0.1.0
    PolicyAssignmentProperties:
      PolicyDefinitionId:
        $referenceType: arm # a policy definition or set definition: ours, or a built-in by ARM ID
    PolicyDefinitionReference:
      PolicyDefinitionId:
        $referenceType: arm # a policy definition in a set
    PolicyDefinitionGroup:
      AdditionalMetadataId:
        $referenceType: arm # a Microsoft.PolicyInsights/policyMetadata resource
    ExternalEvaluationEnforcementSettings:
      MissingTokenAction:
        $importSecretMode: never # audit or deny, not a secret
  2026-01-01-preview:
    PolicyExemption:
      $exportAs: PolicyExemption
      $supportedFrom: v0.1.0
    PolicyExemptionProperties:
      PolicyAssignmentId:
        $referenceType: arm # the assignment exempted from
  2020-05-01:
    PrivateLinkAssociation:
      $exportAs: PrivateLinkAssociation
      $supportedFrom: v0.1.0
    ResourceManagementPrivateLink:
      $exportAs: ResourceManagementPrivateLink
      $supportedFrom: v0.1.0
    PrivateLinkAssociationProperties:
      PrivateLink:
        $referenceType: arm # the Resource Manager private link (ResourceManagementPrivateLink) the association names
  2024-12-01-preview:
    Variable:
      $exportAs: PolicyVariable
      $supportedFrom: v0.1.0
    # Not exported: Variables_Value. Its column value is a scalar (an
    # integer, double, boolean, null or string) that the spec types as an
    # object, so the generated kind sent an object and dropped an empty one
    # (the conformance test caught it); it needs the spec fixed or a
    # hand-written type.
