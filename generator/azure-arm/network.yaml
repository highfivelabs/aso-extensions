typeTransformers:
  - group: network
    version: v20180501
    name: DnsZones_SOA_Spec
    property: Etag
    remove: true
    because: Etag is supposed to be marked ReadOnly in Swagger (ASO removes it from the other record types of this version)
  - group: network
    version: v20260301
    name: RouteFilters_RouteFilterRule_Spec;ServiceEndpointPolicies_ServiceEndpointPolicyDefinition_Spec
    property: Id
    remove: true
    because: a child resource's own ARM ID (the spec's SubResource), which Azure sets (foundation row 12)
  # A VPN connection's own sharedKey is deprecated in the spec ("no more
  # used"); each link connection carries its key (x-ms-secret, a Secret
  # reference). $importSecretMode on it is never consumed by the generator,
  # and a plain string would put a key in the spec, so it is removed.
  - group: network
    version: v20260301
    name: VpnConnectionProperties
    property: SharedKey
    remove: true
    because: deprecated ("no more used"); the link connections' keys are Secret references
  - group: network
    version: v20260301
    name: VpnConnectionProperties_STATUS
    property: SharedKey
    remove: true
    because: a key, deprecated; not shown in the status
  - group: network
    version: v20260301
    name: VpnServerConfigurationProperties_STATUS
    property: P2SVpnGateways
    remove: true
    because: whole point-to-site gateways (their own kind) in the status; the embedded copy's generated tests collide with the gateway kind's (RunJSONSerializationTestForP2SVpnGateway_STATUS redeclared)
  # Keys Azure makes are exported to a Secret ($azureGeneratedSecrets above,
  # generator/_extensions/network/customizations), not kept in the spec,
  # which could only send a key Azure ignores, or the status, which anyone
  # who may read the object reads.
  - group: network
    version: v20260301
    name: ExpressRouteCircuitPropertiesFormat
    property: ServiceKey
    remove: true
    because: made by Azure; exported to a Secret
  - group: network
    version: v20260301
    name: ExpressRouteCircuitPropertiesFormat_STATUS
    property: ServiceKey
    remove: true
    because: a key; exported to a Secret, not shown in the status
  - group: network
    version: v20260301
    name: AuthorizationPropertiesFormat
    property: AuthorizationKey
    remove: true
    because: made by Azure; exported to a Secret
  - group: network
    version: v20260301
    name: AuthorizationPropertiesFormat_STATUS
    property: AuthorizationKey
    remove: true
    because: a key; exported to a Secret, not shown in the status
  - group: network
    version: v20260301
    name: ExpressRoutePortAuthorizationPropertiesFormat_STATUS
    property: AuthorizationKey
    remove: true
    because: a key; exported to a Secret, not shown in the status
  - group: network
    version: v20260301
    name: ExpressRouteCircuits_Authorization_Spec;ExpressRouteCircuits_Peering_Spec;ExpressRouteCircuits_Peerings_Connection_Spec;ExpressRoutePorts_Authorization_Spec;ExpressRouteGateways_ExpressRouteConnection_Spec;VirtualHubs_HubVirtualNetworkConnection_Spec;VirtualHubs_RouteTable_Spec;VirtualHubs_BgpConnection_Spec;VirtualHubs_RoutingIntent_Spec;VirtualHubs_HubRouteTable_Spec;VirtualHubs_IpConfiguration_Spec;VpnGateways_VpnConnection_Spec;VpnGateways_NatRule_Spec
    property: Id
    remove: true
    because: a child resource's own ARM ID (the spec's SubResource), which Azure sets; ASO's subnets and routes have none in their spec either
