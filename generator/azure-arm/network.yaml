typeFilters:
  - action: include
    group: network
    version: v20250501
    because: a stable version of the network security perimeter (2025-03-01, the version of ASO's network kinds, loses the spec side of these)
  - action: include
    group: network
    version: v20260301
    because: the newest stable version, for site-to-site VPN connections and local network gateways (foundation row 8), ExpressRoute (row 9) and Virtual WAN with its VPN gateways (row 10) and the network manager (row 11); ASO has none of these kinds
  - action: include
    group: network
    version: v20180501
    because: the version of ASO's DnsZone (public DNS), for its SOA record set (foundation row 12), so the record and its owner share a vintage
  - action: include
    group: network
    version: v20240601
    because: the version of ASO's PrivateDnsZone, for its SOA record set (foundation row 12)

groupModelConfiguration:
  2018-05-01:
    # A zone's SOA record set: Azure makes it with the zone and never deletes
    # it alone (the kind's Deleter leaves it, generator/_extensions); ASO
    # exports every other record type of this version.
    DnsZones_SOA:
      $exportAs: DnsZonesSOARecord
      $supportedFrom: v0.1.0
    SubResource:
      Id:
        $referenceType: arm # a record set's targetResource (an alias to a public IP, Front Door or Traffic Manager profile)
  2024-06-01:
    PrivateDnsZones_SOA:
      $exportAs: PrivateDnsZonesSOARecord
      $supportedFrom: v0.1.0
  2025-05-01:
    # Foundation row 12: DNS security policies (dnsresolver 2025-05-01, the
    # newest stable; ASO's DnsResolver kinds are at 2022-07-01, which has
    # none of these).
    DnsResolverPolicy:
      $exportAs: DnsResolverPolicy
      $supportedFrom: v0.1.0
    DnsResolverPolicies_DnsSecurityRule:
      $exportAs: DnsResolverPoliciesDnsSecurityRule
      $supportedFrom: v0.1.0
    DnsResolverPolicies_VirtualNetworkLink:
      $exportAs: DnsResolverPoliciesVirtualNetworkLink
      $supportedFrom: v0.1.0
    DnsResolverDomainList:
      $exportAs: DnsResolverDomainList
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeter:
      $exportAs: NetworkSecurityPerimeter
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeters_Profile:
      $exportAs: NetworkSecurityPerimetersProfile
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeters_Profiles_AccessRule:
      $exportAs: NetworkSecurityPerimetersProfilesAccessRule
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeters_ResourceAssociation:
      $exportAs: NetworkSecurityPerimetersResourceAssociation
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeters_Link:
      $exportAs: NetworkSecurityPerimetersLink
      $supportedFrom: v0.1.0
    NetworkSecurityPerimeters_LoggingConfiguration:
      $exportAs: NetworkSecurityPerimetersLoggingConfiguration
      $supportedFrom: v0.1.0
    # With the DNS resolver spec (openapi.json) loaded beside the network
    # security perimeter's, each file's SubResource is renamed after its file.
    NetworkSecurityPerimeterSubResource:
      Id:
        $referenceType: arm # the profile and the associated PaaS resource of an association
    OpenapiSubResource:
      Id:
        $referenceType: arm # a DNS security rule's domain lists, a policy link's virtual network
  2026-03-01:
    # Our ApplicationGateway beside ASO's (2022-07-01), for
    # entraJWTValidationConfigs (the catalog's avm-res-network-applicationgateway,
    # 2026-11-13). ASO's 2022-07-01 marks its
    # children $resourceEmbeddedInParent; 2026-03-01 (TypeSpec) does not
    # make them resources, so only the secrets are labelled.
    ApplicationGateway:
      $exportAs: ApplicationGateway
      $supportedFrom: v0.1.0
    ApplicationGatewaySslCertificatePropertiesFormat:
      Data:
        $importSecretMode: required
      Password:
        $importSecretMode: required
    ApplicationGatewayTrustedClientCertificatePropertiesFormat:
      Data:
        $importSecretMode: required
    ApplicationGatewayTrustedRootCertificatePropertiesFormat:
      Data:
        $importSecretMode: required
    ApplicationGatewayAuthenticationCertificatePropertiesFormat:
      Data:
        $importSecretMode: required
    Connection:
      $exportAs: VirtualNetworkGatewayConnection
      $supportedFrom: v0.1.0
    LocalNetworkGateway:
      $exportAs: LocalNetworkGateway
      $supportedFrom: v0.1.0
    # Foundation row 12: IP groups (Azure Firewall rules name them), route
    # filters (which BGP communities a circuit's Microsoft peering takes) and
    # service endpoint policies (which storage accounts a subnet's service
    # endpoint may reach), with their children.
    IpGroup:
      $exportAs: IpGroup
      $supportedFrom: v0.1.0
    RouteFilter:
      $exportAs: RouteFilter
      $supportedFrom: v0.1.0
    RouteFilters_RouteFilterRule:
      $exportAs: RouteFiltersRouteFilterRule
      $supportedFrom: v0.1.0
    ServiceEndpointPolicy:
      $exportAs: ServiceEndpointPolicy
      $supportedFrom: v0.1.0
    ServiceEndpointPolicies_ServiceEndpointPolicyDefinition:
      $exportAs: ServiceEndpointPoliciesServiceEndpointPolicyDefinition
      $supportedFrom: v0.1.0
    RouteFilterPropertiesFormat:
      Rules:
        $resourceLifecycleOwnedByParent: RouteFilter # route filter rules, kept on a filter's PUT by its extension, as a circuit keeps its peerings
    RouteFilterRule:
      Id:
        $referenceType: simple # a rule's own ID, in the filter's ARM payload only (copied from Azure by the filter's extension)
    ServiceEndpointPolicyPropertiesFormat:
      ServiceEndpointPolicyDefinitions:
        $resourceLifecycleOwnedByParent: ServiceEndpointPolicy # policy definitions, kept on a policy's PUT by its extension
    ServiceEndpointPolicyDefinition:
      Id:
        $referenceType: simple # a definition's own ID, in the policy's ARM payload only (copied from Azure by the policy's extension)
    ExpressRouteCircuit:
      $exportAs: ExpressRouteCircuit
      $supportedFrom: v0.1.0
      $azureGeneratedSecrets:
        - ServiceKey # the key a connectivity provider provisions the circuit with, made by Azure
    ExpressRouteCircuits_Authorization:
      $exportAs: ExpressRouteCircuitsAuthorization
      $supportedFrom: v0.1.0
      $azureGeneratedSecrets:
        - AuthorizationKey # made by Azure; another subscription's connection redeems it
    ExpressRouteCircuits_Peering:
      $exportAs: ExpressRouteCircuitsPeering
      $supportedFrom: v0.1.0
    ExpressRouteCircuits_Peerings_Connection:
      $exportAs: ExpressRouteCircuitsPeeringsConnection
      $supportedFrom: v0.1.0
    ExpressRoutePort:
      $exportAs: ExpressRoutePort
      $supportedFrom: v0.1.0
    ExpressRoutePorts_Authorization:
      $exportAs: ExpressRoutePortsAuthorization
      $supportedFrom: v0.1.0
      $azureGeneratedSecrets:
        - AuthorizationKey # made by Azure; a circuit on the port in another subscription redeems it
    ExpressRouteGateway:
      $exportAs: ExpressRouteGateway
      $supportedFrom: v0.1.0
    ExpressRouteGateways_ExpressRouteConnection:
      $exportAs: ExpressRouteGatewaysExpressRouteConnection
      $supportedFrom: v0.1.0
    VirtualWan:
      $exportAs: VirtualWan
      $supportedFrom: v0.1.0
    VirtualHub:
      $exportAs: VirtualHub
      $supportedFrom: v0.1.0
    VirtualHubs_HubVirtualNetworkConnection:
      $exportAs: VirtualHubsHubVirtualNetworkConnection
      $supportedFrom: v0.1.0
    VirtualHubs_HubRouteTable:
      $exportAs: VirtualHubsHubRouteTable
      $supportedFrom: v0.1.0
    VirtualHubs_RouteTable:
      $exportAs: VirtualHubsRouteTable
      $supportedFrom: v0.1.0
    VirtualHubs_RoutingIntent:
      $exportAs: VirtualHubsRoutingIntent
      $supportedFrom: v0.1.0
    VirtualHubs_BgpConnection:
      $exportAs: VirtualHubsBgpConnection
      $supportedFrom: v0.1.0
    VirtualHubs_IpConfiguration:
      $exportAs: VirtualHubsIpConfiguration
      $supportedFrom: v0.1.0
    VpnGateway:
      $exportAs: VpnGateway
      $supportedFrom: v0.1.0
    VpnGateways_VpnConnection:
      $exportAs: VpnGatewaysVpnConnection
      $supportedFrom: v0.1.0
    VpnGateways_NatRule:
      $exportAs: VpnGatewaysNatRule
      $supportedFrom: v0.1.0
    VpnSite:
      $exportAs: VpnSite
      $supportedFrom: v0.1.0
    VpnServerConfiguration:
      $exportAs: VpnServerConfiguration
      $supportedFrom: v0.1.0
    P2sVpnGateway:
      $exportAs: P2sVpnGateway
      $supportedFrom: v0.1.0
    NetworkManager:
      $exportAs: NetworkManager
      $supportedFrom: v0.1.0
    NetworkManagerConnection:
      $exportAs: NetworkManagerConnection
      $supportedFrom: v0.1.0
    NetworkManagers_ScopeConnection:
      $exportAs: NetworkManagersScopeConnection
      $supportedFrom: v0.1.0
    NetworkManagers_NetworkGroup:
      $exportAs: NetworkManagersNetworkGroup
      $supportedFrom: v0.1.0
    NetworkManagers_NetworkGroups_StaticMember:
      $exportAs: NetworkManagersNetworkGroupsStaticMember
      $supportedFrom: v0.1.0
    NetworkManagers_ConnectivityConfiguration:
      $exportAs: NetworkManagersConnectivityConfiguration
      $supportedFrom: v0.1.0
    NetworkManagers_SecurityAdminConfiguration:
      $exportAs: NetworkManagersSecurityAdminConfiguration
      $supportedFrom: v0.1.0
    NetworkManagers_SecurityAdminConfigurations_RuleCollection:
      $exportAs: NetworkManagersSecurityAdminRuleCollection
      $supportedFrom: v0.1.0
    NetworkManagers_SecurityAdminConfigurations_RuleCollections_Rule:
      $exportAs: NetworkManagersSecurityAdminRule
      $supportedFrom: v0.1.0
    # An admin rule is polymorphic (kind Custom or Default): the resource's
    # spec is a OneOf of the two, and each leaf is labelled as embedded in the
    # resource, as ASO's kusto.yaml does for a database.
    AdminRule:
      $resourceEmbeddedInParent: NetworkManagers_SecurityAdminConfigurations_RuleCollections_Rule
    AdminRule_STATUS:
      $resourceEmbeddedInParent: NetworkManagers_SecurityAdminConfigurations_RuleCollections_Rule
    DefaultAdminRule:
      $resourceEmbeddedInParent: NetworkManagers_SecurityAdminConfigurations_RuleCollections_Rule
    DefaultAdminRule_STATUS:
      $resourceEmbeddedInParent: NetworkManagers_SecurityAdminConfigurations_RuleCollections_Rule
    NetworkManagers_SecurityUserConfiguration:
      $exportAs: NetworkManagersSecurityUserConfiguration
      $supportedFrom: v0.1.0
    NetworkManagers_SecurityUserConfigurations_RuleCollection:
      $exportAs: NetworkManagersSecurityUserRuleCollection
      $supportedFrom: v0.1.0
    NetworkManagers_SecurityUserConfigurations_RuleCollections_Rule:
      $exportAs: NetworkManagersSecurityUserRule
      $supportedFrom: v0.1.0
    ConnectivityGroupItem:
      NetworkGroupId:
        $referenceType: arm # the network group a connectivity configuration applies to (our NetworkManagersNetworkGroup, or an ARM ID)
    Hub:
      ResourceId:
        $referenceType: arm # the hub of a hub-and-spoke topology: a virtual network (ASO's VirtualNetwork) or a Virtual WAN hub (our VirtualHub), or an ARM ID
    NetworkManagerSecurityGroupItem:
      NetworkGroupId:
        $referenceType: arm # the network group a security admin rule collection applies to
    SecurityUserGroupItem:
      NetworkGroupId:
        $referenceType: arm # the network group a security user rule collection applies to
    NetworkManagers_RoutingConfiguration:
      $exportAs: NetworkManagersRoutingConfiguration
      $supportedFrom: v0.1.0
    NetworkManagers_RoutingConfigurations_RuleCollection:
      $exportAs: NetworkManagersRoutingRuleCollection # shorter than the generator's name, as the security rule kinds are (a kind plus List must fit in 63 characters)
      $supportedFrom: v0.1.0
    NetworkManagers_RoutingConfigurations_RuleCollections_Rule:
      $exportAs: NetworkManagersRoutingRule
      $supportedFrom: v0.1.0
    NetworkManagers_Commit:
      $exportAs: NetworkManagersCommit
      $supportedFrom: v0.1.0
    NetworkManagerRoutingGroupItem:
      NetworkGroupId:
        $referenceType: arm # the network group a routing rule collection applies to
    NetworkManagerConnectionProperties:
      NetworkManagerId:
        $referenceType: arm # the network manager a subscription or management group joins (our NetworkManager, or an ARM ID)
    ScopeConnectionProperties:
      ResourceId:
        $referenceType: arm # the subscription or management group, in another tenant, that a network manager asks to manage
    StaticMemberProperties:
      ResourceId:
        $referenceType: arm # the virtual network or subnet a network group holds (ASO's VirtualNetwork, or an ARM ID)
    VpnGatewayProperties:
      Connections:
        $resourceLifecycleOwnedByParent: VpnGateway # VPN connections, kept on a gateway's PUT by its extension, as a circuit keeps its peerings
      NatRules:
        $resourceLifecycleOwnedByParent: VpnGateway # NAT rules, kept the same way
    VpnConnection:
      Id:
        $referenceType: simple # a connection's own ID, in the gateway's ARM payload only (copied from Azure by the gateway's extension)
    VpnGatewayNatRule:
      Id:
        $referenceType: simple # the same, for a NAT rule
    # Site links, link connections and policy groups are embedded in their
    # parents (a site, a connection, a server configuration) and stay there:
    # the spec marks them resources (SubResourceModel), so without
    # $isResource: false the generator reduces each to its ID.
    VpnSiteLink:
      $isResource: false
      Id:
        $referenceType: simple # a site link's own ID (Azure has no PUT for site links)
    VpnSiteLink_STATUS:
      $isResource: false
    VpnSiteLinkConnection:
      $isResource: false
      Id:
        $referenceType: simple # a link connection's own ID (Azure has no PUT for link connections)
    VpnSiteLinkConnection_STATUS:
      $isResource: false
    VpnServerConfigurationPolicyGroup:
      $isResource: false
      Id:
        $referenceType: simple # a policy group's own ID (embedded in the server configuration)
    VpnServerConfigurationPolicyGroup_STATUS:
      $isResource: false
    P2SConnectionConfiguration:
      Id:
        $referenceType: simple # a point-to-site connection configuration's own ID (embedded in the gateway)
    VpnSiteProperties:
      SiteKey:
        $importSecretMode: required # the site's key, a credential
    VirtualHubProperties:
      VirtualHubRouteTableV2s:
        $resourceLifecycleOwnedByParent: VirtualHub # route tables (routeTables), kept on a hub's PUT by its extension, as a circuit keeps its peerings
    VirtualHubRouteTableV2:
      Id:
        $referenceType: simple # a route table's own ID, in the hub's ARM payload only (copied from Azure by the hub's extension)
    Subnet_VirtualHubs_IpConfiguration_SubResourceEmbedded:
      Id:
        $referenceType: arm # the subnet of a hub IP configuration (ASO's VirtualNetworksSubnet, or an ARM ID)
    HubRoute:
      DestinationType:
        $referenceType: simple # CIDR, ResourceId or Service
      NextHopType:
        $referenceType: simple # ResourceId
      NextHop:
        $referenceType: arm # a hub route's next hop: a hub virtual network connection, a firewall (our kind or an ARM ID)
    RoutingPolicy:
      NextHop:
        $referenceType: arm # where a routing intent sends Internet or private traffic: a firewall or network virtual appliance in the hub
    ExpressRouteGatewayProperties:
      ExpressRouteConnections:
        $resourceLifecycleOwnedByParent: ExpressRouteGateway # kept on a gateway's PUT by its extension, as a circuit keeps its peerings
    ExpressRouteConnection:
      Id:
        $referenceType: simple # a connection's own ID, in the gateway's ARM payload only (copied from Azure by the gateway's extension)
    ExpressRouteConnectionProperties:
      AuthorizationKey:
        $importSecretMode: required # a circuit authorization's key, when the circuit is in another subscription
    ExpressRouteCircuitPeeringId:
      Id:
        $referenceType: arm # the circuit's private peering a gateway connection joins (our ExpressRouteCircuitsPeering, or an ARM ID)
    VirtualHubId:
      Id:
        $referenceType: arm # the Virtual WAN hub that holds the gateway (our VirtualHub, or an ARM ID)
    ExpressRouteCircuitPropertiesFormat:
      Peerings:
        $resourceLifecycleOwnedByParent: ExpressRouteCircuit # kept on a circuit's PUT by its extension, as ASO's RouteTable keeps its routes
      Authorizations:
        $resourceLifecycleOwnedByParent: ExpressRouteCircuit
      AuthorizationKey:
        $importSecretMode: required # an ExpressRoute Direct port authorization's key, to make a circuit on another subscription's port
      ActivationKey:
        $importSecretMode: required # the activation key a partner cloud provider gives
    ExpressRouteCircuitPeeringPropertiesFormat:
      Connections:
        $resourceLifecycleOwnedByParent: ExpressRouteCircuits_Peering # (the generator's resource name) Global Reach connections, kept on a peering's PUT by its extension
      SharedKey:
        $importSecretMode: required # the BGP session's MD5 key
    ExpressRouteCircuitPeering:
      Id:
        $referenceType: simple # a peering's own ID, in the circuit's ARM payload only (copied from Azure by the circuit's extension)
    ExpressRouteCircuitAuthorization:
      Id:
        $referenceType: simple # the same, for an authorization
    ExpressRouteCircuitConnection:
      Id:
        $referenceType: simple # the same, for a Global Reach connection in a peering's ARM payload (copied by the peering's extension)
    ExpressRouteCircuitConnection_SubResourceEmbedded:
      Id:
        $referenceType: simple # the same, as the generator names it inside a peering
    ExpressRouteLink:
      Id:
        $referenceType: simple # a port link's own ID, which Azure sets; not a reference to another resource
    ExpressRouteCircuitConnectionPropertiesFormat:
      AuthorizationKey:
        $importSecretMode: required # the peer circuit's authorization key, for Global Reach
    SubResource:
      Id:
        $referenceType: arm # the peer, NAT rules and other references of a connection
    VirtualNetworkGatewayConnectionPropertiesFormat:
      AuthorizationKey:
        $importSecretMode: required # the key of an ExpressRoute circuit authorization, a credential (sharedKey is x-ms-secret in the spec already)

