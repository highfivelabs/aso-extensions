typeFilters:
  - action: include
    group: insights
    version: v20210901
    because: the newest stable version of the Azure Monitor private link scopes
  - action: include
    group: insights
    version: v*20240301preview
    because: >-
      Cross references from other preview versions. Previews are pruned by
      default, which removes the types their neighbours refer to and breaks the
      loading of the spec (as in ASO's own insights.yaml).

  - action: include
    group: insights
    version: v20160301
    because: the only stable version of activity log profiles (logprofiles, 2016-03-01)
  - action: include
    group: insights
    version: v20201120
    because: the newest stable version of workbook templates

groupModelConfiguration:
  2016-03-01:
    LogProfile:
      $exportAs: LogProfile
      $supportedFrom: v0.1.0
    LogProfileProperties:
      StorageAccountId:
        $referenceType: arm # the storage account the activity log is archived to
      ServiceBusRuleId:
        $referenceType: arm # an Event Hubs namespace's authorization rule the activity log streams to
  2020-11-20:
    WorkbookTemplate:
      $exportAs: WorkbookTemplate
      $supportedFrom: v0.1.0
  2021-09-01:
    PrivateLinkScope:
      $exportAs: PrivateLinkScope
      $supportedFrom: v0.1.0
    PrivateLinkScopes_ScopedResource:
      $exportAs: PrivateLinkScopesScopedResource
      $supportedFrom: v0.1.0
    PrivateLinkScopes_PrivateEndpointConnection:
      $exportAs: PrivateLinkScopesPrivateEndpointConnection
      $supportedFrom: v0.1.0
    ScopedResourceProperties:
      LinkedResourceId:
        $referenceType: arm # a Log Analytics workspace, an Application Insights component or a data collection endpoint
