typeFilters:
  - action: include
    group: insights
    version: v20210901
    because: the newest stable version of the Azure Monitor private link scopes
  - action: include
    group: insights
    version: v*20240301preview
    because: >-
      Cross references from other preview versions. Previews are pruned by
      default, which removes the types their neighbours refer to and breaks the
      loading of the spec (as in ASO's own insights.yaml).

  - action: include
    group: insights
    version: v20160301
    because: the only stable version of activity log profiles (logprofiles, 2016-03-01)
  - action: include
    group: insights
    version: v20201120
    because: the newest stable version of workbook templates
  - action: include
    group: insights
    version: v20200301preview
    because: the only version of an Application Insights component's linked storage account (the profiler's), componentLinkedStorageAccounts_API.json
  - action: include
    group: insights
    version: v20210308
    because: the newest stable version of myWorkbooks
  - action: include
    group: insights
    version: v20180601preview
    because: the only version of guestDiagnosticSettings and guestDiagnosticSettingsAssociation
  - action: include
    group: insights
    version: v20230301preview
    because: the only version of tenantActionGroups
  - action: include
    group: insights
    version: v20180501preview
    because: >-
      Application Insights smart detection rules (componentProactiveDetection_API.json;
      docs/plan.md f57): the newest version, and the only one the generator sees as a
      resource (the stable 2015-05-01 is now a TypeSpec openapi.json whose body is
      not marked x-ms-azure-resource and has no id or type)

groupModelConfiguration:
  # Smart detection rules of ASO's Component (2018-05-01-preview; docs/plan.md
  # f57): one per rule name Azure defines (slowpageloadtime, ...); no DELETE.
  2018-05-01-preview:
    Components_ProactiveDetectionConfig:
      $exportAs: ComponentsProactiveDetectionConfig
      $supportedFrom: v0.1.0
  2016-03-01:
    LogProfile:
      $exportAs: LogProfile
      $supportedFrom: v0.1.0
    LogProfileProperties:
      StorageAccountId:
        $referenceType: arm # the storage account the activity log is archived to
      ServiceBusRuleId:
        $referenceType: arm # an Event Hubs namespace's authorization rule the activity log streams to
  2020-03-01-preview:
    Components_LinkedStorageAccount:
      $exportAs: ComponentsLinkedStorageAccount
      $supportedFrom: v0.1.0
    LinkedStorageAccountsProperties:
      LinkedStorageAccount:
        $referenceType: arm # the storage account's ARM ID
  2020-11-20:
    WorkbookTemplate:
      $exportAs: WorkbookTemplate
      $supportedFrom: v0.1.0
  2021-09-01:
    PrivateLinkScope:
      $exportAs: PrivateLinkScope
      $supportedFrom: v0.1.0
    PrivateLinkScopes_ScopedResource:
      $exportAs: PrivateLinkScopesScopedResource
      $supportedFrom: v0.1.0
    PrivateLinkScopes_PrivateEndpointConnection:
      $exportAs: PrivateLinkScopesPrivateEndpointConnection
      $supportedFrom: v0.1.0
    ScopedResourceProperties:
      LinkedResourceId:
        $referenceType: arm # a Log Analytics workspace, an Application Insights component or a data collection endpoint
  2018-06-01-preview:
    GuestDiagnosticSetting:
      $exportAs: GuestDiagnosticSetting
      $supportedFrom: v0.1.0
    GuestDiagnosticSettingsAssociation:
      $exportAs: GuestDiagnosticSettingsAssociation
      $supportedFrom: v0.1.0
    EtwProviderConfiguration:
      Id:
        $referenceType: simple # ETW provider GUID/name, not an ARM resource ID
  2021-03-08:
    MyWorkbook:
      $exportAs: MyWorkbook
      $supportedFrom: v0.1.0
    MyWorkbookProperties:
      SourceId:
        $referenceType: arm # optional source resource ARM ID
  2023-03-01-preview:
    TenantActionGroup:
      $exportAs: TenantActionGroup
      $supportedFrom: v0.1.0
