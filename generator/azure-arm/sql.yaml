# Azure SQL children ASO does not export (Microsoft.Sql, 2025-01-01, the
# newest stable and the version of ASO's own v20250101 Server and
# ServersDatabase): a server's express vulnerability assessment
# (sqlVulnerabilityAssessments/default; ASO's ServersVulnerabilityAssessment
# is the classic, storage-backed one) and a database's geo-backup policy
# (geoBackupPolicies/Default, which a DataWarehouse database turns off; ASO
# leaves it out: "Not actually supported in ARM at the moment", its sql.yaml
# at the pin). The catalog's avm-res-sql-server needs both (2026-11-13).
# Owned by ASO's Server and ServersDatabase.
typeFilters:
  - action: include
    group: sql
    version: v20250101
    because: the version of ASO's Server and ServersDatabase (v20250101)
  - action: prune
    group: sql
    because: every other version is left alone
groupModelConfiguration:
  2025-01-01:
    Servers_SqlVulnerabilityAssessment:
      $exportAs: ServersSqlVulnerabilityAssessment
      $supportedFrom: v0.1.0
    Servers_Databases_GeoBackupPolicy:
      $exportAs: ServersDatabasesGeoBackupPolicy
      $supportedFrom: v0.1.0
    # A server's private endpoint connections (docs/plan.md f37): a private
    # endpoint makes one; the kind approves or rejects it.
    Servers_PrivateEndpointConnection:
      $exportAs: ServersPrivateEndpointConnection
      $supportedFrom: v0.1.0
    # Elastic Jobs (docs/plan.md f39): a job agent on a server (its job
    # database a ServersDatabase by reference), its credentials (the
    # password a Secret), jobs and their steps, target groups and the
    # private endpoints it reaches targets through. A server's DNS alias.
    Servers_JobAgent:
      $exportAs: ServersJobAgent
      $supportedFrom: v0.1.0
    Servers_JobAgents_Credential:
      $exportAs: ServersJobAgentsCredential
      $supportedFrom: v0.1.0
    Servers_JobAgents_Job:
      $exportAs: ServersJobAgentsJob
      $supportedFrom: v0.1.0
    Servers_JobAgents_Jobs_Step:
      $exportAs: ServersJobAgentsJobsStep
      $supportedFrom: v0.1.0
    Servers_JobAgents_TargetGroup:
      $exportAs: ServersJobAgentsTargetGroup
      $supportedFrom: v0.1.0
    Servers_JobAgents_PrivateEndpoint:
      $exportAs: ServersJobAgentsPrivateEndpoint
      $supportedFrom: v0.1.0
    Servers_DnsAlias:
      $exportAs: ServersDnsAlias
      $supportedFrom: v0.1.0
    PrivateEndpointProperty:
      Id:
        $referenceType: arm # the private endpoint's ARM ID (autolabel, reviewed)
    JobStepOutput:
      Credential:
        $referenceType: arm # the credential's ARM ID, our ServersJobAgentsCredential (autolabel wrote simple)
    JobStepProperties:
      TargetGroup:
        $referenceType: arm # the target group's ARM ID, our ServersJobAgentsTargetGroup (autolabel wrote simple)
      Credential:
        $referenceType: arm # the credential's ARM ID, our ServersJobAgentsCredential (autolabel wrote simple)
    JobTarget:
      RefreshCredential:
        $referenceType: arm # the credential's ARM ID, our ServersJobAgentsCredential (autolabel wrote simple)
    JobCredentialProperties:
      Password:
        $importSecretMode: required # the credential's password, from a Secret (autolabel, reviewed)
