# Service Bus children ASO does not export (Microsoft.ServiceBus,
# servicebus.json 2026-01-01, the newest stable version; docs/plan.md f61,
# tier 3 row t1 of docs/coverage/foundation.md): a namespace's network rule
# set (its one default: the IP and virtual network rules, the default action,
# public network access, trusted services), its private endpoint connections
# (approved or rejected) and its geo-disaster recovery alias (the pairing with
# a namespace in another region). Owned by ASO's Namespace. Not exported: the
# 2018-01-01-preview IP filter and virtual network rules (replaced by the rule
# set) and migration configurations (a PUT starts a Standard to Premium
# migration).
typeFilters:
  - action: include
    group: servicebus
    version: v20260101
    because: the newest stable version of the namespace's children
  - action: prune
    group: servicebus
    because: every other version is left alone (ASO has the namespace, its queues, topics, subscriptions and rules)
typeTransformers:
  - group: servicebus
    version: v20260101
    name: PrivateEndpointConnectionProperties
    property: ProvisioningState
    remove: true
    because: set by Azure; should be marked readOnly (ASO removes it from its eventhub group's connections)
groupModelConfiguration:
  2026-01-01:
    Namespaces_NetworkRuleSet:
      $exportAs: NamespacesNetworkRuleSet
      $supportedFrom: v0.1.0
    Namespaces_PrivateEndpointConnection:
      $exportAs: NamespacesPrivateEndpointConnection
      $supportedFrom: v0.1.0
    Namespaces_DisasterRecoveryConfig:
      $exportAs: NamespacesDisasterRecoveryConfig
      $supportedFrom: v0.1.0
    Subnet:
      Id:
        $referenceType: arm # a virtual network rule's subnet (ASO's VirtualNetworksSubnet, or an ARM ID)
    PrivateEndpoint:
      Id:
        $referenceType: arm # the private endpoint of a connection (ASO's PrivateEndpoint, or an ARM ID)
    ArmDisasterRecoveryProperties:
      PartnerNamespace:
        $referenceType: arm # the paired namespace in another region (ASO's Namespace, or an ARM ID)
