#
# The two checks CONTRIBUTING.md asks for, on every pull request and on
# main: `task check` and `task operator-e2e`, each after `task tools` (ASO
# at the pin plus patches/, and setup-envtest), as on an offload Spot VM
# (docs/handoff.md, "Running things"). Both run against the fake cloud
# only: no credentials, no real Azure, never a live test.
#
# Tool versions: Go from go.mod; kind v0.33.0 (docs/plan.md, the version
# the operator e2e passed on, and the offload image's); ko and Task at the
# versions the builder's machines run (none is pinned in the repository).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: v3.54.0
  KIND_VERSION: v0.33.0
  KO_VERSION: v0.19.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ASO's checkout, its Go build cache and the generator's output do
      # not fit in the runner's free disk otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go module and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'UPSTREAM.md') }}
          restore-keys: go-${{ runner.os }}-

      - name: Upstream checkout and specs (by pin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/azure-service-operator
            .cache/azure-rest-api-specs
          key: upstream-${{ hashFiles('UPSTREAM.md', 'patches/**', 'generator/specs.txt') }}
          restore-keys: upstream-

      - name: Tools (bin/ and Task)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/setup-envtest
            bin/envtest
            ~/tools/bin
          key: tools-${{ runner.os }}-${{ env.TASK_VERSION }}-${{ hashFiles('Taskfile.yml') }}

      - name: Install Task
        run: |
          mkdir -p ~/tools/bin
          echo "${HOME}/tools/bin" >> "${GITHUB_PATH}"
          # The tools need a newer Go than go.mod's; GOTOOLCHAIN=auto fetches
          # it for these installs only (the repository builds with go.mod's).
          [ -x ~/tools/bin/task ] || GOTOOLCHAIN=auto GOBIN="${HOME}/tools/bin" go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"

      - name: task tools
        run: task tools

      - name: task check
        run: task check

  operator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Restored from the check job's cache, never saved from here: the two
      # would otherwise race to write the same key.
      - name: Go module and build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'UPSTREAM.md') }}
          restore-keys: go-${{ runner.os }}-

      - name: Upstream checkout and specs (by pin)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/azure-service-operator
            .cache/azure-rest-api-specs
          key: upstream-${{ hashFiles('UPSTREAM.md', 'patches/**', 'generator/specs.txt') }}
          restore-keys: upstream-

      - name: Tools (Task, kind, ko)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/setup-envtest
            ~/tools/bin
          key: e2e-tools-${{ runner.os }}-${{ env.TASK_VERSION }}-${{ env.KIND_VERSION }}-${{ env.KO_VERSION }}-${{ hashFiles('Taskfile.yml') }}

      - name: Install Task, kind and ko
        run: |
          mkdir -p ~/tools/bin
          echo "${HOME}/tools/bin" >> "${GITHUB_PATH}"
          export GOBIN="${HOME}/tools/bin"
          # The tools need a newer Go than go.mod's; GOTOOLCHAIN=auto fetches
          # it for these installs only (the repository builds with go.mod's).
          export GOTOOLCHAIN=auto
          [ -x ~/tools/bin/task ] || go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          [ -x ~/tools/bin/kind ] || go install "sigs.k8s.io/kind@${KIND_VERSION}"
          [ -x ~/tools/bin/ko ] || go install "github.com/google/ko@${KO_VERSION}"
          ~/tools/bin/kind version
          ~/tools/bin/ko version
          kubectl version --client
          docker version --format '{{.Server.Version}}'

      - name: task tools
        run: task tools

      - name: task operator-e2e
        run: task operator-e2e

      - name: Keep the e2e log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-e2e-log
          path: bin/operator-e2e/last-run.log
          if-no-files-found: ignore
