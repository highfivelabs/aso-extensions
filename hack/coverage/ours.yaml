# The kinds written by hand in this repository, and what they cover.
# Generated kinds (apis/arm) need no entry: their ARM wire types say it.
#
# Every spec property of a listed CRD must be mapped or ignored, so adding a
# field to a kind makes hack/coverage/run.sh fail until the field is placed.
kinds:
  - crd: config/crds/authorization.azure.hfl.dev_managementlocks.yaml
    armType: Microsoft.Authorization/locks
    api: "2020-05-01"
    ignore: [owner, azureName]
    # CRD spec path -> the lock's ARM attribute
    map:
      level: properties.level
      notes: properties.notes
      owners[].applicationId: properties.owners[].applicationId
  - crd: config/crds/dbforpostgresql.azure.hfl.dev_users.yaml
    outside: Microsoft.DBforPostgreSQL/flexibleServers/users
    note: "a database role, not an ARM resource; extends ASO's PostgreSQL User"
    ignore: [owner, azureName]
  - crd: config/crds/sql.azure.hfl.dev_users.yaml
    outside: Microsoft.Sql/servers/databases/users
    note: "a database user, not an ARM resource; ASO's Azure SQL User with Entra users (ASO pull request #5104)"
    ignore: [owner, azureName]
  - crd: config/crds/entra.azure.hfl.dev_directoryroleassignments.yaml
    outside: Microsoft Graph roleManagement/directory/roleAssignments
    note: "a Microsoft Entra directory role assignment (Microsoft Graph), not an ARM resource; c15"
    ignore: [principalId, principalIdFromConfig, roleDefinitionId, directoryScopeId, appScopeId, condition, operatorSpec]
  - crd: config/crds/keyvault.azure.hfl.dev_vaultsecrets.yaml
    outside: Microsoft.KeyVault/vaults/secrets (data plane)
    api: "7.5"
    note: "the vault's data plane (secrets), not the ARM vaults/secrets resource"
    ignore: [owner, azureName]
  - crd: config/crds/keyvault.azure.hfl.dev_vaultcertificates.yaml
    outside: Microsoft.KeyVault/vaults/certificates (data plane)
    api: "7.5"
    note: "the vault's data plane (certificates); ARM has no such resource"
    ignore: [owner, azureName]
