# The inputs of the coverage dashboard, pinned (hack/coverage). Change a pin,
# then run hack/coverage/run.sh and commit the result. `run.sh --check` fails
# if the committed outputs are not what these inputs give.
#
# The third input, this repository's own CRDs and generated kinds, is the
# checkout the outputs are committed with.
specs:
  repo: https://github.com/Azure/azure-rest-api-specs.git
  # The commit Azure Service Operator's own submodule (v2/specs) pins at the
  # ASO commit below, so ASO and the denominator read the same specs.
  commit: a2de2d1a53d195c987a30184b2ddd378417ff44e
  commitDate: "2026-10-22"
  fetched: "2026-11-09"
aso:
  repo: https://github.com/Azure/azure-service-operator.git
  # UPSTREAM.md's "Commit" row; run.sh refuses to run if they differ.
  commit: b9dcbe48feaf1173f48ab28dd5edc48b514d3f4d
  commitDate: "2026-11-06"
  nearestRelease: v2.22.0
  fetched: "2026-11-09"
terraform:
  # The Terraform comparison bar (docs/coverage/README.md, "Terraform"): the
  # catalog's estimate of how much of this denominator the azurerm provider
  # reaches. The catalog repository is private, so the two files are vendored
  # byte-identical under docs/coverage/inputs/terraform/; the generator fails
  # if a copy differs from its sha256 here.
  repo: https://github.com/highfivelabs/catalog
  commit: 13064af34996c47f1a5498bb17aca16194c4574e
  commitDate: "2026-11-09"
  fetched: "2026-11-10"
  provider: azurerm
  files:
    - from: docs/terraform/aso-extensions/terraform.csv
      path: docs/coverage/inputs/terraform/terraform.csv
      sha256: b8782a2eea6fd8ac8cd8529bb892f5f52be62d11f352d20ace45dd3da603955f
    - from: docs/terraform/aso-extensions/terraform-resources.csv
      path: docs/coverage/inputs/terraform/terraform-resources.csv
      sha256: 190880a2c07f2f3e64442f3ea60378e28536ef6d86435b087b8d5d8d3bb1298e
