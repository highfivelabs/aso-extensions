#
# Every task needs the pinned Azure Service Operator checkout;
# `task upstream` fetches it (about 675 MB, not committed). The task names
# are the Makefile's they replace. Tasks that more than one repository needs
# are factory's taskfiles/go.yml, included below.
version: '3'

includes:
  # The tasks the extension repositories share (go:install-tool,
  # go:fmt-check, go:committed, go:test-envtest), from factory at a tag,
  # pinned by checksum (factory taskfiles/README.md). Task fetches it with
  # your git credentials and caches it in .task/remote/ (.taskrc.yml);
  # offload packs that cache for its VMs.
  go:
    taskfile: https://github.com/highfivelabs/factory.git//taskfiles/go.yml?ref=taskfiles/v1.0.0
    checksum: 4e300f59230b59ea875e8409e786064dd76cc3c28d5de37ec46bb856d7366f32
    vars:
      BIN: '{{.ROOT_DIR}}/bin'

vars:
  # The project's name: the image, and the prefix of the install's objects.
  NAME: aso-extensions
  BIN: '{{.ROOT_DIR}}/bin'
  ENVTEST_K8S_VERSION: '1.37.0'
  # setup-envtest at controller-runtime's version in ASO's go.mod.
  SETUP_ENVTEST: sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2

env:
  GOTOOLCHAIN: '{{if .GOTOOLCHAIN}}{{.GOTOOLCHAIN}}{{else}}local{{end}}'

tasks:
  default:
    desc: Everything that must hold before a commit (check)
    cmds:
      - task: check

  all:
    desc: As default (the Makefile's all)
    cmds:
      - task: check

  tools:
    desc: ASO at the pin plus patches/ (task upstream) and setup-envtest; what a fresh checkout needs first (an offload Spot VM, --prep 'task tools')
    cmds:
      - task: upstream
      - task: setup-envtest

  setup-envtest:
    internal: true
    cmds:
      - task: go:install-tool
        vars: {NAME: setup-envtest, PKG: '{{.SETUP_ENVTEST}}'}

  upstream:
    desc: Fetch ASO at the pin (about 675 MB) and apply patches/
    cmds:
      - hack/upstream.sh

  upstream-check:
    desc: Fail if the checkout is not the pin plus patches/, or go.mod versions differ from ASO's
    cmds:
      - hack/upstream.sh --check
      - hack/check-go-mod.sh

  "upstream:yaml-check":
    desc: Fail if upstream.yaml (UPSTREAM.md, machine-readable) and UPSTREAM.md disagree; needs no upstream checkout.
    dir: hack/upstream-yaml
    cmds:
      - go run . ../..

  generate:
    desc: Deepcopy code and CRDs from apis/
    cmds:
      - task: upstream-check
      - hack/generate.sh

  generate-arm:
    desc: Rerun ASO's generator over the ARM specs (heavy; run it on a machine meant for that)
    cmds:
      - task: upstream-check
      - hack/generate-arm.sh
      - hack/generate.sh

  build:
    desc: Build the manager
    cmds:
      - task: upstream-check
      - go build -o {{.BIN}}/manager ./cmd/manager

  test:
    desc: Unit tests and the end-to-end tests (envtest, the fake cloud in process, PostgreSQL in Docker)
    cmds:
      - task: upstream-check
      - hack/check-tests-present.sh
      - task: setup-envtest
      - task: go:test-envtest
        vars:
          ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION}}'
          CMD: go test ./... -count=1 {{.CLI_ARGS}}

  check:
    desc: Everything that must hold before a commit
    cmds:
      - task: upstream-check
      - task: upstream:yaml-check
      - task: go:fmt-check
        vars: {DIRS: apis cmd pkg test}
      - hack/generate-arm.sh
      - hack/generate.sh
      - task: go:committed
        vars:
          PATHS: apis config pkg/controllers generator
          HINT: task generate-arm
      - go vet ./...
      - go vet -tags fakecloud ./cmd/manager
      - hack/check-no-fake-cloud.sh
      - hack/check-spdx.sh
      - hack/test-operator-e2e-guard.sh
      - hack/test-upstream-check.sh
      - task: build
      - task: test

  operator-e2e:
    desc: The install on kind with the fake cloud (tests/operator/run.sh); fails unless it ends with "all checks passed"
    cmds:
      - task: upstream-check
      - NAME={{.NAME}} hack/operator-e2e.sh

  coverage:
    desc: Regenerate the coverage dashboard (docs/coverage and the README's Coverage section)
    cmds:
      - hack/coverage/run.sh

  coverage-check:
    desc: Fail if the committed coverage dashboard differs from a regeneration
    cmds:
      - hack/coverage/run.sh --check

  clean:
    desc: Remove bin/
    cmds:
      - rm -rf {{.BIN}}
