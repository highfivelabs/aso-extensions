#
# How krm-registry (registry.highfivelabs.dev) shows this provider. Its build
# reads this file from main (krm-registry config.py has the format).
#
# install: the provider page's Install card, one entry per variant. A variant
# with oci: names where the chart is published on cr.highfivelabs.dev; the
# registry shows it only once that chart is published, at the newest
# release-shaped tag there ({version}). Until then the page has no card.
schema: 1
install:
  - name: High Five Labs chart
    oci: charts/aso-extensions
    when: clusters running Azure Service Operator v2
    note: >-
      Installs the CRDs and the manager in ASO's own namespace. It reads ASO's credentials as ASO
      does (aso-controller-settings, a namespace's aso-credential,
      serviceoperator.azure.com/credential-from), so nothing more is needed. No webhook:
      validation is CEL rules in the CRDs.
    steps: |
      helm install aso-extensions oci://cr.highfivelabs.dev/charts/aso-extensions \
        --version {version} \
        --namespace azureserviceoperator-system --create-namespace
