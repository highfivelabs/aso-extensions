kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vaultsprotecteditems.recoveryservices.azure.hfl.dev
spec:
  group: recoveryservices.azure.hfl.dev
  names:
    categories:
    - azure
    - recoveryservices
    - hfl
    kind: VaultsProtectedItem
    listKind: VaultsProtectedItemList
    plural: vaultsprotecteditems
    singular: vaultsprotecteditem
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.protectionState
      name: Protection
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      type: string
    name: v20260701
    schema:
      openAPIV3Schema:
        description: |-
          VaultsProtectedItem is an item a Recovery Services vault backs up: today an
          Azure virtual machine (backup turned on for the VM with a backup policy).
          Written by hand (docs/plan.md §3 c24; ASOQ Q14, builder, 2026-11-15):
          ARM keeps it under a fabric that is no resource,
          .../vaults/{vault}/backupFabrics/Azure/protectionContainers/{container}/protectedItems/{item},
          which ASO's generator cannot own through. Reconciled on ASO's generic
          reconciler with ASO's ARM client (PUT and DELETE are long-running), with
          the credential ASO picks for the object.
          - ARM URI: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.RecoveryServices/vaults/{vaultName}/backupFabrics/Azure/protectionContainers/{containerName}/protectedItems/{protectedItemName}
          - Spec: specification/recoveryservicesbackup, stable/2026-07-01, bms.json (ProtectedItems_CreateOrUpdate)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              azureName:
                description: |-
                  AzureName: the protected item's name in the container. Defaults to
                  vm;iaasvmcontainerv2;<resource group>;<vm>, from the virtual machine,
                  written here when the object is first claimed.
                maxLength: 260
                pattern: ^[^/?#]*$
                type: string
              containerName:
                description: |-
                  ContainerName: the protection container the item is in. Defaults to
                  iaasvmcontainer;iaasvmcontainerv2;<resource group>;<vm>, from the
                  virtual machine, written here when the object is first claimed. Azure
                  registers a virtual machine's container itself when protection is
                  turned on.
                maxLength: 260
                pattern: ^[^/?#]*$
                type: string
              diskExclusionProperties:
                description: |-
                  DiskExclusionProperties: which data disks (by LUN) are backed up
                  (ARM properties.extendedProperties.diskExclusionProperties).
                properties:
                  diskLunList:
                    description: 'DiskLunList: the LUNs of the data disks listed.'
                    items:
                      type: integer
                    type: array
                  isInclusionList:
                    description: |-
                      IsInclusionList: true backs up only the listed disks; false backs up
                      all but them.
                    type: boolean
                type: object
              owner:
                description: |-
                  Owner: the vault that backs the item up. Owner is expected to be a
                  reference to a recoveryservices.azure.hfl.dev/Vault resource, or an
                  ARM ID of a vault.
                properties:
                  armId:
                    pattern: (?i)(^(/subscriptions/([^/]+)(/resourcegroups/([^/]+))?)?/providers/([^/]+)/([^/]+/[^/]+)(/([^/]+/[^/]+))*$|^/subscriptions/([^/]+)(/resourcegroups/([^/]+))?$)
                    type: string
                  name:
                    description: This is the name of the Kubernetes resource to reference.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name and armId
                  rule: has(self.name) != has(self.armId)
              policyReference:
                description: |-
                  PolicyReference: the backup policy (ARM properties.policyId), a
                  recoveryservices.azure.hfl.dev VaultsBackupPolicy of the same vault, or
                  an ARM ID. Required unless protectionState is ProtectionStopped.
                properties:
                  armId:
                    description: |-
                      ARMID is a string of the form /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}.
                      The /resourcegroups/{resourceGroupName} bit is optional as some resources are scoped at the subscription level
                      ARMID is mutually exclusive with Group, Kind, Namespace and Name.
                    pattern: (?i)(^(/subscriptions/([^/]+)(/resourcegroups/([^/]+))?)?/providers/([^/]+)/([^/]+/[^/]+)(/([^/]+/[^/]+))*$|^/subscriptions/([^/]+)(/resourcegroups/([^/]+))?$)
                    type: string
                  group:
                    description: Group is the Kubernetes group of the resource.
                    type: string
                  kind:
                    description: Kind is the Kubernetes kind of the resource.
                    type: string
                  name:
                    description: Name is the Kubernetes name of the resource.
                    type: string
                type: object
              protectionState:
                description: |-
                  ProtectionState: Protected (the default: back up on the policy's
                  schedule), BackupsSuspended (keep the recovery points, take no new
                  backups) or ProtectionStopped (stop protection and retain the data).
                enum:
                - Protected
                - BackupsSuspended
                - ProtectionStopped
                type: string
              sourceResourceReference:
                description: |-
                  SourceResourceReference: the virtual machine to back up (ARM
                  properties.sourceResourceId): a compute.azure.com or
                  compute.azure.hfl.dev VirtualMachine by group, kind and name, or an
                  ARM ID.
                properties:
                  armId:
                    description: |-
                      ARMID is a string of the form /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}.
                      The /resourcegroups/{resourceGroupName} bit is optional as some resources are scoped at the subscription level
                      ARMID is mutually exclusive with Group, Kind, Namespace and Name.
                    pattern: (?i)(^(/subscriptions/([^/]+)(/resourcegroups/([^/]+))?)?/providers/([^/]+)/([^/]+/[^/]+)(/([^/]+/[^/]+))*$|^/subscriptions/([^/]+)(/resourcegroups/([^/]+))?$)
                    type: string
                  group:
                    description: Group is the Kubernetes group of the resource.
                    type: string
                  kind:
                    description: Kind is the Kubernetes kind of the resource.
                    type: string
                  name:
                    description: Name is the Kubernetes name of the resource.
                    type: string
                type: object
            required:
            - owner
            - sourceResourceReference
            type: object
            x-kubernetes-validations:
            - message: azureName is immutable
              rule: '!has(oldSelf.azureName) || self.azureName == oldSelf.azureName'
            - message: containerName is immutable
              rule: '!has(oldSelf.containerName) || self.containerName == oldSelf.containerName'
            - message: owner is immutable
              rule: self.owner == oldSelf.owner
            - message: 'sourceResourceReference is immutable: another virtual machine
                is another protected item'
              rule: self.sourceResourceReference == oldSelf.sourceResourceReference
            - message: policyReference is required unless protectionState is ProtectionStopped
              rule: has(self.policyReference) || (has(self.protectionState) && self.protectionState
                == 'ProtectionStopped')
            - message: diskExclusionProperties.isInclusionList is required with a
                diskLunList
              rule: '!has(self.diskExclusionProperties) || !has(self.diskExclusionProperties.diskLunList)
                || has(self.diskExclusionProperties.isInclusionList)'
          status:
            description: VaultsProtectedItem_STATUS is the protected item as Azure
              reports it.
            properties:
              backupManagementType:
                description: 'BackupManagementType: AzureIaasVM for a virtual machine.'
                type: string
              conditions:
                description: 'Conditions: The observed state of the resource'
                items:
                  description: Condition defines an extension to status (an observation)
                    of a resource
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human readable message indicating
                        details about the transition. This field may be empty.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration is the .metadata.generation that the condition was set based upon. For instance, if
                        .metadata.generation is currently 12, but the .status.condition[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: |-
                        Reason for the condition's last transition.
                        Reasons are upper CamelCase (PascalCase) with no spaces. A reason is always provided, this field will not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        For conditions which have positive polarity (Status == True is their normal/healthy state), this will be omitted when Status == True
                        For conditions which have negative polarity (Status == False is their normal/healthy state), this will be omitted when Status == False.
                        This is omitted in all cases when Status == Unknown
                      type: string
                    status:
                      description: Status of the condition, one of True, False, or
                        Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              containerName:
                description: |-
                  ContainerName: the container, as Azure names it in the item
                  (iaasvmcontainerv2;<resource group>;<vm>).
                type: string
              diskExclusionProperties:
                description: 'DiskExclusionProperties: the data disks chosen, as Azure
                  holds them.'
                properties:
                  diskLunList:
                    description: 'DiskLunList: the LUNs of the data disks listed.'
                    items:
                      type: integer
                    type: array
                  isInclusionList:
                    description: |-
                      IsInclusionList: true backs up only the listed disks; false backs up
                      all but them.
                    type: boolean
                type: object
              friendlyName:
                description: 'FriendlyName: the virtual machine''s name.'
                type: string
              healthStatus:
                description: 'HealthStatus: the health of the last backup, such as
                  Passed.'
                type: string
              id:
                description: 'Id: the protected item''s ARM ID.'
                type: string
              lastBackupStatus:
                description: 'LastBackupStatus: the result of the last backup, such
                  as Completed.'
                type: string
              lastBackupTime:
                description: 'LastBackupTime: when the last backup ran.'
                type: string
              name:
                description: 'Name: the protected item''s name.'
                type: string
              policyId:
                description: 'PolicyId: the ARM ID of the backup policy.'
                type: string
              protectedItemType:
                description: |-
                  ProtectedItemType: Microsoft.Compute/virtualMachines for a virtual
                  machine.
                type: string
              protectionState:
                description: |-
                  ProtectionState: Protected, IRPending (before the first backup),
                  ProtectionStopped, BackupsSuspended, ProtectionError, ProtectionPaused.
                type: string
              protectionStatus:
                description: 'ProtectionStatus: the item''s protection health, such
                  as Healthy.'
                type: string
              sourceResourceId:
                description: 'SourceResourceId: the ARM ID of what is backed up.'
                type: string
              workloadType:
                description: 'WorkloadType: VM for a virtual machine.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
