                          drive in windows (or AZ_BATCH_NODE_ROOT_DIR in Linux). It won't' mount any data paths into container if this array is
                          set as empty.
                        items:
                          description: The entry of path and mount mode you want to
                            mount into task container.
                          properties:
                            isReadOnly:
                              description: |-
                                IsReadOnly: For Linux, if you mount this path as a read/write mode, this does not mean that all users in container have
                                the read/write access for the path, it depends on the access in host VM. If this path is mounted read-only, all users
                                within the container will not be able to modify the path.
                              type: boolean
                            source:
                              description: 'Source: The paths which will be mounted
                                to container task''s container.'
