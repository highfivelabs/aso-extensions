                      example, if the maximum retry count is 3, Batch tries the task up to 4 times (one initial try and 3 retries). If the
                      maximum retry count is 0, the Batch service does not retry the task. If the maximum retry count is -1, the Batch service
                      retries the task without limit. Default is 0
                    type: integer
                  resourceFiles:
                    description: 'ResourceFiles: A list of files that the Batch service
