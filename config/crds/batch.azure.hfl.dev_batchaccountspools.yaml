                        type: boolean
                    type: object
                  mode:
                    description: |-
                      Mode: Specifies the mode of an upgrade to virtual machines in the scale set.
                      Possible values are:
                      Manual - You  control the application of updates to virtual machines in the scale set. You do this by using the
                      manualUpgrade action.
                      Automatic - All virtual machines in the scale set are automatically updated at the same time.
                      Rolling - Scale set performs updates in batches with an optional pause time in between.
                    type: string
                  rollingUpgradePolicy:
                    description: 'RollingUpgradePolicy: The configuration parameters
                      used while performing a rolling upgrade.'
