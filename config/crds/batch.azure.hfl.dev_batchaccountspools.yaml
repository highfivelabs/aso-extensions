                                characters.  If any invalid values are provided the request fails with HTTP status code 400.
                              type: string
                            networkSecurityGroupRules:
                              description: |-
                                NetworkSecurityGroupRules: The maximum number of rules that can be specified across all the endpoints on a Batch pool is
                                25. If no network security group rules are specified, a default rule will be created to allow inbound access to the
                                specified backendPort. If the maximum number of network security group rules is exceeded the request fails with HTTP
                                status code 400.
                              items:
                                description: A network security group rule to apply
                                  to an inbound endpoint.
                                properties:
                                  access:
                                    description: 'Access: The action that should be
                                      taken for a specified IP address, subnet range
                                      or tag.'
                                    type: string
                                  priority:
                                    description: |-
                                      Priority: Priorities within a pool must be unique and are evaluated in order of priority. The lower the number the
                                      higher the priority. For example, rules could be specified with order numbers of 150, 250, and 350. The rule with the
                                      order number of 150 takes precedence over the rule that has an order of 250. Allowed priorities are 150 to 4096. If any
                                      reserved or duplicate values are provided the request fails with HTTP status code 400.
                                    type: integer
                                  sourceAddressPrefix:
                                    description: |-
                                      SourceAddressPrefix: Valid values are a single IP address (i.e. 10.10.10.10), IP subnet (i.e. 192.168.1.0/24), default
                                      tag, or * (for all addresses).  If any other values are provided the request fails with HTTP status code 400.
                                    type: string
                                  sourcePortRanges:
                                    description: |-
                                      SourcePortRanges: Valid values are '*' (for all ports 0 - 65535) or arrays of ports or port ranges (i.e. 100-200). The
                                      ports should in the range of 0 to 65535 and the port ranges or ports can't overlap. If any other values are provided the
                                      request fails with HTTP status code 400. Default value will be *.
                                    items:
                                      type: string
                                    type: array
                                type: object
                              type: array
                            protocol:
                              description: 'Protocol: The protocol of the endpoint.'
                              type: string
                          type: object
                        type: array
                    type: object
                  publicIPAddressConfiguration:
                    description: 'PublicIPAddressConfiguration: The public IP Address
                      configuration of the networking configuration of a Pool.'
                    properties:
                      ipAddressIds:
                        description: |-
                          IpAddressIds: The number of IPs specified here limits the maximum size of the Pool - 100 dedicated nodes or 100
                          Spot/low-priority nodes can be allocated for each public IP. For example, a pool needing 250 dedicated VMs would need at
                          least 3 public IPs specified. Each element of this collection is of the form:
                          /subscriptions/{subscription}/resourceGroups/{group}/providers/Microsoft.Network/publicIPAddresses/{ip}.
                        items:
                          type: string
                        type: array
                      ipFamilies:
                        description: |-
                          IpFamilies: IP families are used to determine single-stack or dual-stack pools. For single-stack, the expected value is
                          IPv4. For dual-stack, the expected values are IPv4 and IPv6.
