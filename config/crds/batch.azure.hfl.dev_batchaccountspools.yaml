                description: 'UpgradePolicy: Describes an upgrade policy - automatic,
                  manual, or rolling.'
                properties:
                  automaticOSUpgradePolicy:
                    description: 'AutomaticOSUpgradePolicy: The configuration parameters
                      used for performing automatic OS upgrade.'
                    properties:
                      disableAutomaticRollback:
                        description: 'DisableAutomaticRollback: Whether OS image rollback
                          feature should be disabled.'
