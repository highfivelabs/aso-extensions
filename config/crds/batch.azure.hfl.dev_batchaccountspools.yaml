                  targetLowPriorityNodes:
                    description: 'TargetLowPriorityNodes: The desired number of Spot/low-priority
                      compute nodes in the pool.'
                    type: integer
                type: object
              scaleSettings:
                description: |-
                  ScaleSettings: Defines the desired size of the pool. This can either be 'fixedScale' where the requested
                  targetDedicatedNodes is specified, or 'autoScale' which defines a formula which is periodically reevaluated. If this
                  property is not specified, the pool will have a fixed scale with 0 targetDedicatedNodes.
                properties:
                  autoScale:
                    description: 'AutoScale: This property and fixedScale are mutually
                      exclusive and one of the properties must be specified.'
                    properties:
                      evaluationInterval:
                        description: 'EvaluationInterval: If omitted, the default
                          value is 15 minutes (PT15M).'
                        type: string
                      formula:
                        description: 'Formula: A formula for the desired number of
                          compute nodes in the pool.'
                        type: string
                    type: object
                  fixedScale:
                    description: 'FixedScale: This property and autoScale are mutually
                      exclusive and one of the properties must be specified.'
                    properties:
                      nodeDeallocationOption:
                        description: 'NodeDeallocationOption: If omitted, the default
                          value is Requeue.'
                        type: string
                      resizeTimeout:
                        description: |-
