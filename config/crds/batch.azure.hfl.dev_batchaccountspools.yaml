                          minutes. The minimum value is 5 minutes. If you specify a value less than 5 minutes, the Batch service rejects the
                          request with an error; if you are calling the REST API directly, the HTTP status code is 400 (Bad Request).
                        type: string
                      targetDedicatedNodes:
                        description: 'TargetDedicatedNodes: At least one of targetDedicatedNodes,
                          targetLowPriorityNodes must be set.'
                        type: integer
                      targetLowPriorityNodes:
                        description: 'TargetLowPriorityNodes: At least one of targetDedicatedNodes,
                          targetLowPriorityNodes must be set.'
                        type: integer
                    type: object
                type: object
              startTask:
                description: |-
                  StartTask: In an PATCH (update) operation, this property can be set to an empty object to remove the start task from the
                  pool.
                properties:
                  commandLine:
                    description: |-
                      CommandLine: The command line does not run under a shell, and therefore cannot take advantage of shell features such as
                      environment variable expansion. If you want to take advantage of such features, you should invoke the shell in the
                      command line, for example using "cmd /c MyCommand" in Windows or "/bin/sh -c MyCommand" in Linux. Required if any other
