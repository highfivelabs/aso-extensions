    - azure
    - web
    - hfl
    kind: SitesConfigConnectionStrings
    listKind: SitesConfigConnectionStringsList
    plural: sitesconfigconnectionstrings
    singular: sitesconfigconnectionstrings
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
