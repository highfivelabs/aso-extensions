# Tests only: the fake cloud on kind. PostgreSQL set up like a flexible
# server (TLS, azure_pg_admin, Entra administrators, pgaadauth), the fake
# Key Vault, the fake Resource Manager (locks) and the fake Azure SQL server
# (cmd/fakesql: team-a's aso-workload signs in as its Entra administrator). Their certificates, the CA and the init script come from
# tests/operator/fixtures, as Secrets and ConfigMaps made by
# tests/operator/run.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: fake-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fake-cloud
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:17
        imagePullPolicy: IfNotPresent
        env:
        - {name: POSTGRES_PASSWORD, value: super-password}
        command: ["sh", "-c"]
        args:
        - >-
          install -o postgres -m 600 /tls/tls.key /tmp/server.key &&
          install -o postgres -m 644 /tls/tls.crt /tmp/server.crt &&
          cp /init/init.sql /docker-entrypoint-initdb.d/init.sql &&
          exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["sh", "-c", "psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname = 'azure_pg_admin'\" | grep -q 1"]
          periodSeconds: 2
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
        - {name: init, mountPath: /init, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: postgres-tls}
      - name: init
        configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fake-cloud
spec:
  selector: {app: postgres}
  ports:
  - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakevault
  namespace: fake-cloud
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakevault}
  template:
    metadata:
      labels: {app: fakevault}
    spec:
      containers:
      - name: fakevault
        image: ko://github.com/highfivelabs/aso-extensions/cmd/fakevault
        args:
        - --listen=:8443
        - --base-url=https://fakevault.fake-cloud.svc
        - --trust=$(TRUST)
        env:
        - name: TRUST
          valueFrom:
            configMapKeyRef: {name: fakevault-trust, key: trust}
        ports:
        - containerPort: 8443
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: fakevault-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fakevault
  namespace: fake-cloud
spec:
  selector: {app: fakevault}
  ports:
  - {port: 443, targetPort: 8443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakearm
  namespace: fake-cloud
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakearm}
  template:
    metadata:
      labels: {app: fakearm}
    spec:
      containers:
      - name: fakearm
        image: ko://github.com/highfivelabs/aso-extensions/cmd/fakearm
        args:
        - --listen=:8443
        - --audience=https://fakearm.fake-cloud.svc
        - --trust=$(TRUST)
        - --resource=$(RESOURCES)
        env:
        - name: TRUST
          valueFrom:
            configMapKeyRef: {name: fakevault-trust, key: trust}
        - name: RESOURCES
          valueFrom:
            configMapKeyRef: {name: fakearm-resources, key: resources}
        ports:
        - containerPort: 8443
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: fakearm-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fakearm
  namespace: fake-cloud
spec:
  selector: {app: fakearm}
  ports:
  - {port: 443, targetPort: 8443}
---
# The fake Microsoft Graph (cmd/fakegraph): directory role assignments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakegraph
  namespace: fake-cloud
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakegraph}
  template:
    metadata:
      labels: {app: fakegraph}
    spec:
      containers:
      - name: fakegraph
        image: ko://github.com/highfivelabs/aso-extensions/cmd/fakegraph
        args:
        - --listen=:8443
        - --audience=https://fakegraph.fake-cloud.svc
        - --trust=$(TRUST)
        - --principal=$(PRINCIPALS)
        - --administrative-unit=$(UNITS)
        env:
        - name: TRUST
          valueFrom:
            configMapKeyRef: {name: fakevault-trust, key: trust}
        - name: PRINCIPALS
          valueFrom:
            configMapKeyRef: {name: fakegraph-directory, key: principals}
        - name: UNITS
          valueFrom:
            configMapKeyRef: {name: fakegraph-directory, key: administrativeUnits}
        ports:
        - containerPort: 8443
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: fakegraph-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fakegraph
  namespace: fake-cloud
spec:
  selector: {app: fakegraph}
  ports:
  - {port: 443, targetPort: 8443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakesql
  namespace: fake-cloud
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakesql}
  template:
    metadata:
      labels: {app: fakesql}
    spec:
      containers:
      - name: fakesql
        image: ko://github.com/highfivelabs/aso-extensions/cmd/fakesql
        args:
        - --listen=:1433
        - --admin=sqladmin
        - --admin-password=sql-admin-password-1
        - --entra-admin=aso-sql-admins
        - --principal=aso-sql-admins=$(TEAM_A)
        - --principal=team-b-identity=$(TEAM_B)
        - --directory=app-identity,data-readers,team-b-identity,aso-sql-admins
        - --database=appdb
        env:
        - name: TEAM_A
          valueFrom:
            configMapKeyRef: {name: fakesql-principals, key: team-a}
        - name: TEAM_B
          valueFrom:
            configMapKeyRef: {name: fakesql-principals, key: team-b}
        ports:
        - containerPort: 1433
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: fakesql-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fakesql
  namespace: fake-cloud
spec:
  selector: {app: fakesql}
  ports:
  - {port: 1433, targetPort: 1433}
