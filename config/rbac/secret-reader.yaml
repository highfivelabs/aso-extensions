# Reading Secrets: aso-credential, a credential-from Secret and the Secrets
# our kinds' values name, always in the namespace of the object being
# reconciled (docs/plan.md §8, question 4, answered 2026-11-16: "Read Secrets
# only in the object's namespace"; test/e2e/secret_namespace_test.go). ASO's
# framework keeps an informer on Secrets in the namespaces the manager
# watches: every namespace, or those AZURE_TARGET_NAMESPACES names.
#
# A role of its own, bound in every namespace here. An install that sets
# AZURE_TARGET_NAMESPACES adds config/namespaced-secret-reader, which drops
# this ClusterRoleBinding, and binds the ClusterRole with a RoleBinding in
# each of those namespaces only (README.md, "Reading Secrets").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-reader
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
