# The manager's rights: our kinds; reading the ASO owners it resolves
# (FlexibleServer, Vault, ManagedEnvironment, ResourceGroup, Site, Workspace, Registry, VirtualMachine, ManagedCluster, Fleet); reading Secrets and ConfigMaps (aso-credential,
# credential-from secrets, the values our kinds name; ASO's framework keeps
# informers on both); reading Namespaces (ASO's reconcile-policy annotation
# on a namespace); events. Of ASO's, only get on its resources, for a
# ManagementLock's owner (aso-owner-reader.yaml, generated).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager
rules:
- apiGroups: ["dbforpostgresql.azure.hfl.dev", "keyvault.azure.hfl.dev", "authorization.azure.hfl.dev", "sql.azure.hfl.dev", "entra.azure.hfl.dev"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["dbforpostgresql.azure.hfl.dev", "keyvault.azure.hfl.dev", "authorization.azure.hfl.dev", "sql.azure.hfl.dev", "entra.azure.hfl.dev"]
  resources: ["*/status", "*/finalizers"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["dbforpostgresql.azure.com"]
  resources: ["flexibleservers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["keyvault.azure.com"]
  resources: ["vaults"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sql.azure.com"]
  resources: ["servers", "serversdatabases"]
  verbs: ["get", "list", "watch"]
# The ASO kinds the generated ARM kinds name as owners (generator/external-owners.txt)
# and the resource group above them: read through the cache, so list and watch.
- apiGroups: ["app.azure.com"]
  resources: ["managedenvironments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resources.azure.com"]
  resources: ["resourcegroups"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["web.azure.com"]
  resources: ["sites"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["operationalinsights.azure.com"]
  resources: ["workspaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["containerregistry.azure.com"]
  resources: ["registries"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["network.azure.com"]
  resources: ["dnszones", "privatednszones"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["compute.azure.com"]
  resources: ["virtualmachines"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["containerservice.azure.com"]
  resources: ["managedclusters", "fleets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["documentdb.azure.com"]
  resources: ["databaseaccounts", "sqldatabases"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "configmaps", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
# ASO's strict workload identity: a token for each namespace's aso-workload
# service account, exactly as ASO's
# workload-identity-token-creator-role grants ASO's own manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-identity-token-creator
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: ["aso-workload"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-identity-token-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-identity-token-creator
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election
  namespace: azureserviceoperator-system
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election
  namespace: azureserviceoperator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
