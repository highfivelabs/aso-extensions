# The manager's rights: our kinds; reading the ASO owners it resolves
# (FlexibleServer, Vault, ManagedEnvironment, ResourceGroup, Site, Workspace, Registry, VirtualMachine, ManagedCluster, Fleet, Component); reading ConfigMaps (the values our kinds name; ASO's framework keeps
# an informer on them); writing ConfigMaps (a kind's operatorSpec.configMaps
# and configMapExpressions, as ASO's manager writes them: create or update,
# owned by the object, removed by the garbage collector); reading Namespaces
# (ASO's reconcile-policy annotation on a namespace); events. Of ASO's, only
# get on its resources, for a ManagementLock's owner (aso-owner-reader.yaml,
# generated). Reading Secrets is secret-reader.yaml, a role of its own so
# that an install can bind it in some namespaces only
# (config/namespaced-secret-reader); writing Secrets is the opt-in
# config/secret-writer (docs/plan.md §8, questions 4 and 9).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager
rules:
- apiGroups: ["dbforpostgresql.azure.hfl.dev", "keyvault.azure.hfl.dev", "authorization.azure.hfl.dev", "sql.azure.hfl.dev", "entra.azure.hfl.dev"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["dbforpostgresql.azure.hfl.dev", "keyvault.azure.hfl.dev", "authorization.azure.hfl.dev", "sql.azure.hfl.dev", "entra.azure.hfl.dev"]
  resources: ["*/status", "*/finalizers"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["dbforpostgresql.azure.com"]
  resources: ["flexibleservers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["keyvault.azure.com"]
  resources: ["vaults"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["sql.azure.com"]
  resources: ["servers", "serversdatabases", "serverselasticpools", "managedinstances", "managedinstancesdatabases"]
  verbs: ["get", "list", "watch"]
# The ASO kinds the generated ARM kinds name as owners (generator/external-owners.txt)
# and the resource group above them: read through the cache, so list and watch.
- apiGroups: ["app.azure.com"]
  resources: ["managedenvironments", "containerapps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resources.azure.com"]
  resources: ["resourcegroups"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["web.azure.com"]
  resources: ["sites", "serverfarms"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["operationalinsights.azure.com"]
  resources: ["workspaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["containerregistry.azure.com"]
  resources: ["registries"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["network.azure.com"]
  resources: ["dnszones", "privatednszones", "azurefirewalls", "bastionhosts", "ddosprotectionplans", "firewallpolicies", "loadbalancers", "natgateways", "networkinterfaces", "networksecuritygroups", "privateendpoints", "publicipaddresses", "routetables", "virtualnetworks", "dnsresolvers", "dnsforwardingrulesets", "firewallpoliciesrulecollectiongroups", "applicationsecuritygroups", "networkwatchers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["compute.azure.com"]
  resources: ["virtualmachines", "disks", "diskaccesses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["containerservice.azure.com"]
  resources: ["managedclusters", "fleets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["documentdb.azure.com"]
  resources: ["databaseaccounts", "sqldatabases", "mongoclusters"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["servicebus.azure.com"]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["eventhub.azure.com"]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["eventgrid.azure.com"]
  resources: ["namespaces", "namespacetopics"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apimanagement.azure.com"]
  resources: ["services", "apis", "products"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["dbformysql.azure.com"]
  resources: ["flexibleservers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["signalrservice.azure.com"]
  resources: ["signalrs", "replicas"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kusto.azure.com"]
  resources: ["clusters", "databases"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["dataprotection.azure.com"]
  resources: ["backupvaults"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cognitiveservices.azure.com"]
  resources: ["accounts", "projects"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.azure.com"]
  resources: ["storageaccounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["insights.azure.com"]
  resources: ["components"]
  verbs: ["get", "list", "watch"]
# The ASO kinds the catalog's ManagementLocks name as owners (controllers.OwnerTypes()).
- apiGroups: ["cache.azure.com"]
  resources: ["redis", "redisenterprises"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["appconfiguration.azure.com"]
  resources: ["configurationstores"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "update"]
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
# ASO's strict workload identity: a token for each namespace's aso-workload
# service account, exactly as ASO's
# workload-identity-token-creator-role grants ASO's own manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-identity-token-creator
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: ["aso-workload"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-identity-token-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-identity-token-creator
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election
  namespace: azureserviceoperator-system
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election
  namespace: azureserviceoperator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election
subjects:
- kind: ServiceAccount
  name: manager
  namespace: azureserviceoperator-system
