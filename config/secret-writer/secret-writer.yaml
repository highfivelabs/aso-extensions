# Full names: a component's resources do not get the install's namePrefix.
# The subject is the install's manager account (config/install, namePrefix
# aso-extensions-; config/rbac/role.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aso-extensions-secret-writer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aso-extensions-secret-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aso-extensions-secret-writer
subjects:
- kind: ServiceAccount
  name: aso-extensions-manager
  namespace: azureserviceoperator-system
